<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MantaF — Manajemen Tata Kelola Jabatan Fungsional Kesehatan -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16b3a4"/>
      <stop offset="42%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0a544e"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="16%" r="86%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded squircle -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#glow)"/>

  <!-- Inner premium ring -->
  <rect x="17" y="17" width="478" height="478" rx="103" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="5"/>

  <!-- Monogram M (strokes bulat, modern) -->
  <path d="M 154 316 L 154 128 L 256 248 L 358 128 L 358 316"
        fill="none" stroke="#ffffff" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Denyut nadi EKG (aksen emas kesehatan) -->
  <path d="M 158 392 L 216 392 L 234 368 L 256 410 L 278 374 L 290 392 L 354 392"
        fill="none" stroke="url(#pulse)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
