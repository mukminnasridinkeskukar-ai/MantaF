nation": "Imunisasi polio diberikan 4 kali pada bayi: saat lahir (IPV-0), usia 2, 3, dan 4 bulan."}, {"id": 6, "category": "asuhan-pelayanan", "section": "teknis", "text": "Pengobatan Tuberkulosis (TB) menggunakan strategi DOTS yang mencakup periode pengobatan standar selama...", "options": {"A": "2 bulan", "B": "4 bulan", "C": "6 bulan", "D": "8 bulan", "E": "12 bulan"}, "correctAnswer": "C", "explanation": "Strategi DOTS untuk TB standar berdurasi 6 bulan (2 bulan fase intensif + 4 bulan fase lanjutan)."}, {"id": 7, "category": "asuhan-pelayanan", "section": "teknis", "text": "Saat melakukan pengkajian keperawatan, langkah pertama dalam proses keperawatan adalah...", "options": {"A": "Diagnosa keperawatan", "B": "Perencanaan", "C": "Pengkajian", "D": "Implementasi", "E": "Evaluasi"}, "correctAnswer": "C", "explanation": "Proses keperawatan dimulai dengan pengkajian untuk mengumpulkan data subjektif dan objektif pasien."}, {"id": 8, "category": "asuhan-pelayanan", "section": "teknis", "text": "Tanda bahaya pada anak balita yang memerlukan rujukan segera ke fasilitas kesehatan adalah...", "options": {"A": "Nafsu makan menurun", "B": "Batuk pilek ringan", "C": "Tidak bisa minum/menyusu", "D": "Berak warna hijau", "E": "Suhu 37.5°C"}, "correctAnswer": "C", "explanation": "Tidak bisa minum/menyusu merupakan tanda bahaya umum pada Balita Sakit (MTBS) yang mengindikasikan kondisi serius."}, {"id": 9, "category": "asuhan-pelayanan", "section": "teknis", "text": "Deteksi dini tumbuh kembang balita menggunakan KPSP dilakukan pada usia...", "options": {"A": "3-72 bulan", "B": "6-60 bulan", "C": "12-48 bulan", "D": "0-24 bulan", "E": "24-72 bulan"}, "correctAnswer": "B", "explanation": "KPSP (Kuesioner Pra-Skrining Perkembangan) digunakan untuk skrining tumbuh kembang anak usia 6-60 bulan."}, {"id": 10, "category": "asuhan-pelayanan", "section": "teknis", "text": "Penyakit Tidak Menular (PTM) yang menjadi prioritas program Pengelolaan PTM di Puskesmas antara lain...", "options": {"A": "Tifus, kolera, diare", "B": "Hipertensi, DM, kanker", "C": "TB, HIV, malaria", "D": "ISPA, pneumonia, asma", "E": "Hepatitis, chikungunya"}, "correctAnswer": "B", "explanation": "Prioritas PTM meliputi hipertensi, diabetes mellitus, kanker, dan penyakit jantung sesuai program Pengelolaan PTM."}, {"id": 11, "category": "asuhan-pelayanan", "section": "teknis", "text": "Klasifikasi stunting berdasarkan panjang badan menurut umur (PB/U) menggunakan z-score. Anak dikategorikan stunting jika z-score...", "options": {"A": "> +2 SD", "B": "Antara -2 SD hingga +2 SD", "C": "< -2 SD", "D": "< -3 SD", "E": "< -1 SD"}, "correctAnswer": "C", "explanation": "Stunting (sangat pendek) didefinisikan sebagai PB/U atau TB/U dengan z-score < -2 SD; sangat pendek jika < -3 SD."}, {"id": 12, "category": "asuhan-pelayanan", "section": "teknis", "text": "Pada ibu hamil, pemberian tablet tambah darah (TTD) minimal selama...", "options": {"A": "30 hari", "B": "60 hari", "C": "90 hari", "D": "120 hari", "E": "180 hari"}, "correctAnswer": "C", "explanation": "Ibu hamil dianjurkan mengonsumsi TTD minimal 90 hari selama kehamilan untuk mencegah anemia."}, {"id": 13, "category": "asuhan-pelayanan", "section": "teknis", "text": "Tanda/gejala K4 (Kunjungan ke-4) pada ibu hamil dilakukan pada trimester...", "options": {"A": "Trimester I (usia kehamilan < 12 minggu)", "B": "Trimester II (usia kehamilan 12-24 minggu)", "C": "Trimester III (usia kehamilan 24-36 minggu)", "D": "Trimester IV (usia kehamilan > 36 minggu)", "E": "Setiap trimester"}, "correctAnswer": "C", "explanation": "K4 adalah kunjungan ke-4 ibu hamil yang dilakukan pada trimester III (usia kehamilan 24-36 minggu)."}, {"id": 14, "category": "asuhan-pelayanan", "section": "teknis", "text": "Pada pemeriksaan tekanan darah, hipertensi pada dewasa didefinisikan sebagai tekanan sistolik dan diastolik berturut-turut...", "options": {"A": "> 110/70 mmHg", "B": "> 120/80 mmHg", "C": "> 130/85 mmHg", "D": "> 140/90 mmHg", "E": "> 160/100 mmHg"}, "correctAnswer": "D", "explanation": "Hipertensi pada dewasa didefinisikan sebagai tekanan darah ≥ 140/90 mmHg berdasarkan Pedoman PTM Kemenkes."}, {"id": 15, "category": "asuhan-pelayanan", "section": "teknis", "text": "Pemberian ASI eksklusif dianjurkan selama minimal...", "options": {"A": "2 bulan", "B": "4 bulan", "C": "6 bulan", "D": "12 bulan", "E": "24 bulan"}, "correctAnswer": "C", "explanation": "ASI eksklusif diberikan tanpa makanan/minuman lain selama 6 bulan pertama kehidupan bayi."}, {"id": 16, "category": "asuhan-pelayanan", "section": "teknis", "text": "Jenis imunisasi yang diberikan saat bayi lahir di fasilitas kesehatan adalah...", "options": {"A": "BCG dan polio", "B": "Hepatitis B-0 dan polio-0", "C": "Campak dan BCG", "D": "DPT-HB-Hib", "E": "IPV dan rotavirus"}, "correctAnswer": "B", "explanation": "Saat lahir, bayi mendapat imunisasi Hepatitis B-0 (dalam 24 jam pertama) dan polio-0."}, {"id": 17, "category": "asuhan-pelayanan", "section": "teknis", "text": "Prinsip penanganan diare akut pada balita dengan rencana terapi B (diare tanpa dehidrasi) adalah...", "options": {"A": "Pemberian cairan IV dan rujukan segera", "B": "Pemberian oralit, zinc, dan teruskan ASI/makanan", "C": "Pemberian antibiotik spektrum luas", "D": "Pemberian antidiare dan antiemetik", "E": "Puasa 24 jam lalu reintroduksi cairan"}, "correctAnswer": "B", "explanation": "Pada diare tanpa dehidrasi (rencana B), berikan oralit, zinc selama 10 hari, dan teruskan ASI/makanan."}, {"id": 18, "category": "asuhan-pelayanan", "section": "teknis", "text": "Penatalaksanaan awal penderita stroke iskemik akut yang datang < 4,5 jam sejak onset gejala adalah...", "options": {"A": "Pemberian aspirin oral", "B": "Trombolisis dengan rt-PA", "C": "Antikoagulan heparin IV", "D": "Dekstran IV bolus", "E": "Manitol IV"}, "correctAnswer": "B", "explanation": "Pada stroke iskemik akut dalam window terapi < 4,5 jam, trombolisis dengan rt-PA (alteplase) adalah standar bila tidak ada kontraindikasi."}, {"id": 19, "category": "asuhan-pelayanan", "section": "teknis", "text": "Tanda klinis syok hipovolemik pada dewasa yang paling sensitif adalah...", "options": {"A": "Hipotensi", "B": "Takikardia", "C": "Penurunan kesadaran", "D": "Ekstremitas dingin", "E": "Oliguria"}, "correctAnswer": "B", "explanation": "Takikardia adalah tanda paling awal dan sensitif syok hipovolemik, muncul sebelum hipotensi terjadi."}, {"id": 20, "category": "asuhan-pelayanan", "section": "teknis", "text": "Pada MTBS, klasifikasi pneumonia berat ditandai dengan...", "options": {"A": "Batuk, napas tidak cepat", "B": "Batuk, napas cepat", "C": "Batuk, stridor dan dinding dada bawah tertarik", "D": "Batuk, demam ringan", "E": "Batuk, pilek"}, "correctAnswer": "C", "explanation": "Pneumonia berat pada MTBS ditandai dengan adanya stridor dan dinding dada bawah tertarik (chest indrawing)."}, {"id": 21, "category": "asuhan-pelayanan", "section": "teknis", "text": "Frekuensi napas normal dewasa adalah...", "options": {"A": "8-12 kali/menit", "B": "12-20 kali/menit", "C": "20-30 kali/menit", "D": "30-40 kali/menit", "E": "40-60 kali/menit"}, "correctAnswer": "B", "explanation": "Frekuensi napas normal dewasa adalah 12-20 kali per menit."}, {"id": 22, "category": "asuhan-pelayanan", "section": "teknis", "text": "Tanda Cushing triad pada peningkatan tekanan intrakranial meliputi...", "options": {"A": "Hipotensi, bradikardia, takipnea", "B": "Hipertensi, bradikardia, pola napas ireguler", "C": "Hipertensi, takikardia, demam", "D": "Hipotensi, takikardia, hipoksia", "E": "Hipertensi, takipnea, miosis"}, "correctAnswer": "B", "explanation": "Triad Cushing: hipertensi, bradikardia, dan pola napas ireguler (cheyne-stokes) menandakan peningkatan TIK signifikan."}, {"id": 23, "category": "asuhan-pelayanan", "section": "teknis", "text": "Skrining kanker serviks menggunakan metode IVA (Inspeksi Visual dengan Asam Asetat) dilakukan pada wanita usia...", "options": {"A": "20-50 tahun", "B": "30-50 tahun", "C": "40-60 tahun", "D": "25-65 tahun", "E": "35-70 tahun"}, "correctAnswer": "B", "explanation": "Skrining IVA dianjurkan pada wanita usia 30-50 tahun, dilakukan setiap 5 tahun jika hasil negatif."}, {"id": 24, "category": "asuhan-pelayanan", "section": "teknis", "text": "Pada bayi dengan ikterus fisiologis, biasanya muncul pada hari ke...", "options": {"A": "Hari ke-1", "B": "Hari ke-2 sampai 3", "C": "Hari ke-4 sampai 5", "D": "Hari ke-7", "E": "Hari ke-14"}, "correctAnswer": "B", "explanation": "Ikterus fisiologis muncul pada hari ke-2 sampai ke-3, mencapai puncak hari ke-4-5, dan hilang dalam 1-2 minggu."}, {"id": 25, "category": "asuhan-pelayanan", "section": "teknis", "text": "Penanganan luka bakar derajat II dengan luas < 10% pada dewasa sebaiknya...", "options": {"A": "Dibiarkan terbuka", "B": "Diberi salep antibiotik saja", "C": "Dinginkan dengan air mengalir, beri penutup steril", "D": "Segera rujuk ke RS", "E": "Berikan es batu langsung ke luka"}, "correctAnswer": "C", "explanation": "Luka bakar derajat II < 10% pada dewasa: dinginkan dengan air mengalir 20 menit, lalu tutup dengan kasa steril."}, {"id": 26, "category": "asuhan-pelayanan", "section": "teknis", "text": "Pada Pengelolaan Terpadu Balita Sakit (MTBS), tanda umum bahaya yang memerlukan rujukan segera adalah...", "options": {"A": "Batuk lebih dari 7 hari", "B": "Tidak bisa minum/menyusu, muntah semua, kejang", "C": "Demam 2 hari", "D": "Diare 2 kali sehari", "E": "Pilek dan batuk"}, "correctAnswer": "B", "explanation": "Tanda umum bahaya pada MTBS meliputi tidak bisa minum/menyusu, muntah semua, dan kejang — semuanya perlu rujukan segera."}, {"id": 27, "category": "asuhan-pelayanan", "section": "teknis", "text": "Tanda vital penderita dewasa dengan status gawat darurat yang memerlukan resusitasi segera adalah...", "options": {"A": "Sistolik 110 mmHg", "B": "Sistolik < 90 mmHg", "C": "Nadi 80 kali/menit", "D": "Suhu 37.2°C", "E": "SpO2 95%"}, "correctAnswer": "B", "explanation": "Tekanan darah sistolik < 90 mmHg pada dewasa menandakan syok dan memerlukan resusitasi cairan segera."}, {"id": 28, "category": "asuhan-pelayanan", "section": "teknis", "text": "Pengobatan standar filariasis massal menggunakan obat...", "options": {"A": "Albendazole + DEC", "B": "Ivermectin + DEC", "C": "Praziquantel", "D": "Metronidazole", "E": "Diethylcarbamazine citrate tunggal"}, "correctAnswer": "A", "explanation": "Pengobatan massal filariasis menggunakan kombinasi DEC + Albendazole diminum sekali setahun selama 5 tahun."}, {"id": 29, "category": "asuhan-pelayanan", "section": "teknis", "text": "Skrining tumbuh kembang bayi usia 0-6 bulan yang penting dilakukan terkait gangguan pendengaran adalah...", "options": {"A": "OAE (Otoacoustic Emission)", "B": "Audiometri nada murni", "C": "Rinne test", "D": "Weber test", "E": "BERA diagnostik"}, "correctAnswer": "A", "explanation": "OAE (Otoacoustic Emission) adalah metode skrining pendengaran bayi baru lahir yang non-invasif dan cepat."}, {"id": 30, "category": "asuhan-pelayanan", "section": "teknis", "text": "Pada pasien dengan kejang demam kompleks, tanda yang membedakan dari kejang demam sederhana adalah...", "options": {"A": "Durasi < 5 menit, umum", "B": "Durasi > 15 menit, fokal atau berulang dalam 24 jam", "C": "Demam < 38°C", "D": "Suhu normal saat kejang", "E": "Tidak ada riwayat demam"}, "correctAnswer": "B", "explanation": "Kejang demam kompleks ditandai durasi > 15 menit, fokal, atau berulang dalam 24 jam — berbeda dari kejang demam sederhana."}, {"id": 31, "category": "etika-hukum", "section": "teknis", "text": "Prinsip informed consent dalam pelayanan kesehatan berasaskan...", "options": {"A": "Otonomi pasien", "B": "Beneficence", "C": "Non-maleficence", "D": "Justice", "E": "Veracity"}, "correctAnswer": "A", "explanation": "Informed consent berasaskan prinsip otonomi pasien, yaitu hak pasien untuk menentukan nasibnya sendiri."}, {"id": 32, "category": "etika-hukum", "section": "teknis", "text": "Prinsip bioetika", "options": {"A": "Menghormati keputusan pasien", "B": "Melakukan yang terbaik untuk pasien", "C": "Tidak menimbulkan kerugian", "D": "Keadilan dalam distribusi sumber daya", "E": "Mengatakan yang benar"}, "correctAnswer": "B", "explanation": "Beneficence adalah prinsip berbuat baik, melakukan tindakan terbaik untuk kepentingan pasien."}, {"id": 33, "category": "etika-hukum", "section": "teknis", "text": "Prinsip non-maleficence dalam pelayanan kesehatan dikenal dengan istilah...", "options": {"A": "Berbuat baik", "B": "Tidak membahayakan (primum non nocere)", "C": "Menghormati otonomi", "D": "Keadilan distribusi", "E": "Mengatakan kebenaran"}, "correctAnswer": "B", "explanation": "Non-maleficence berasal dari prinsip primum non nocere ="}, {"id": 34, "category": "etika-hukum", "section": "teknis", "text": "Enam Sasaran Keselamatan Pasien (Patient Safety) menurut Permenkes yang pertama adalah...", "options": {"A": "Mengurangi risiko infeksi nosokomial", "B": "Identifikasi pasien dengan benar", "C": "Peningkatan keamanan obat yang perlu perhatian khusus", "D": "Komitmen keselamatan pasien", "E": "Komunikasi yang efektif"}, "correctAnswer": "B", "explanation": "Sasaran 1 Patient Safety adalah identifikasi pasien dengan benar menggunakan minimal 2 identitas (nama lengkap + tanggal lahir)."}, {"id": 35, "category": "etika-hukum", "section": "teknis", "text": "Pada Sasaran Keselamatan Pasien,", "options": {"A": "Sasaran 1: Identifikasi pasien", "B": "Sasaran 3: Meningkatkan keamanan prosedur tindakan invasif", "C": "Sasaran 4: Meningkatkan keamanan operasi", "D": "Sasaran 5: Mengurangi risiko infeksi", "E": "Sasaran 6: Mengurangi risiko pasien jatuh"}, "correctAnswer": "C", "explanation": "Penandaan lokasi operasi termasuk Sasaran 4: Meningkatkan keamanan operasi (correct site, correct procedure, correct patient)."}, {"id": 36, "category": "etika-hukum", "section": "teknis", "text": "Kewajiban tenaga kesehatan menjaga rahasia medis pasien tertuang dalam...", "options": {"A": "UU No. 36 Tahun 2009 tentang Kesehatan", "B": "UU No. 29 Tahun 2004 tentang Praktik Kedokteran", "C": "UU No. 44 Tahun 2009 tentang Rumah Sakit", "D": "Semua di atas", "E": "Permenkes tentang Rekam Medis"}, "correctAnswer": "D", "explanation": "Kewajiban menjaga rahasia medis pasien diatur dalam berbagai UU: 36/2009, 29/2004, dan 44/2009."}, {"id": 37, "category": "etika-hukum", "section": "teknis", "text": "Hak pasien untuk menolak tindakan medis dilindungi oleh...", "options": {"A": "Prinsip veracity", "B": "Prinsip otonomi", "C": "Prinsip beneficence", "D": "Prinsip justice", "E": "Prinsip paternalism"}, "correctAnswer": "B", "explanation": "Hak menolak tindakan adalah bentuk otonomi pasien yang harus dihormati tenaga kesehatan setelah diberi informasi."}, {"id": 38, "category": "etika-hukum", "section": "teknis", "text": "Sasaran Keselamatan Pasien ke-6 (Pasien Jatuh) menggunakan skala Morse. Skor Morse yang menunjukkan risiko jatuh tinggi adalah...", "options": {"A": "< 25", "B": "25-50", "C": "> 50", "D": "> 75", "E": "> 100"}, "correctAnswer": "C", "explanation": "Skala Morse > 50 menunjukkan risiko jatuh tinggi yang memerlukan intervensi pencegahan."}, {"id": 39, "category": "etika-hukum", "section": "teknis", "text": "Sanksi hukum bagi tenaga kesehatan yang melakukan malapraktik sesuai UU No. 36 Tahun 2009 dapat berupa...", "options": {"A": "Teguran lisan saja", "B": "Sanksi administratif, perdata, dan pidana", "C": "Pemutusan kontrak kerja", "D": "Denda administratif", "E": "Tidak ada sanksi"}, "correctAnswer": "B", "explanation": "Malapraktik dapat dikenai sanksi administratif (izin dicabut), perdata (ganti rugi), dan pidana jika memenuhi unsur pidana."}, {"id": 40, "category": "etika-hukum", "section": "teknis", "text": "Dalam komunikasi terapeutik, prinsip konfidensialitas dapat dilanggar dalam kondisi...", "options": {"A": "Saat pasien meminta", "B": "Saat ada kepentingan umum yang lebih tinggi (wabah, kekerasan)", "C": "Saat pasien akan pindah RS", "D": "Saat dokter konsultan meminta", "E": "Tidak pernah bisa dilanggar"}, "correctAnswer": "B", "explanation": "Konfidensialitas dapat dilanggar jika kepentingan umum lebih tinggi (mis. wabah, ancaman nyawa orang lain)."}, {"id": 41, "category": "etika-hukum", "section": "teknis", "text": "Prinsip komunikasi", "options": {"A": "Situation, Background, Assessment, Recommendation", "B": "Subjective, Background, Action, Result", "C": "Situation, Briefing, Analysis, Resolution", "D": "Standard, Benchmark, Action, Report", "E": "Symptom, Background, Allergy, Response"}, "correctAnswer": "A", "explanation": "SBAR = Situation, Background, Assessment, Recommendation — format komunikasi standar untuk handover pasien."}, {"id": 42, "category": "etika-hukum", "section": "teknis", "text": "Pada informed consent, yang bukan merupakan unsur wajib adalah...", "options": {"A": "Diagnosis", "B": "Tindakan medis dan tujuan", "C": "Risiko dan komplikasi", "D": "Biaya total pasti", "E": "Alternatif tindakan"}, "correctAnswer": "D", "explanation": "Biaya total pasti bukan unsur wajib informed consent (meskipun etis disampaikan); unsur wajib: diagnosis, tindakan, tujuan, risiko, alternatif, prognosis."}, {"id": 43, "category": "etika-hukum", "section": "teknis", "text": "Pada Sasaran Keselamatan Pasien ke-2 (Peningkatan keamanan obat), obat dengan", "options": {"A": "Obat dengan nama mirip dan ejaan mirip yang berisiko tertukar", "B": "Obat generik dan paten", "C": "Obat keras dan obat bebas", "D": "Obat narkotik dan psikotropika", "E": "Obat dosis tinggi"}, "correctAnswer": "A", "explanation": "LASA = Look-Alike Sound-Alike, obat dengan nama/ejaan serupa yang berisiko tertukar, harus dikelola khusus."}, {"id": 44, "category": "etika-hukum", "section": "teknis", "text": "Dokumen rekam medis menurut Permenkes No. 24 Tahun 2022 harus disimpan minimal selama...", "options": {"A": "5 tahun", "B": "10 tahun", "C": "15 tahun", "D": "20 tahun", "E": "Selama pasien hidup"}, "correctAnswer": "B", "explanation": "Berdasarkan Permenkes 24/2022, rekam medis disimpan minimal 10 tahun setelah pasien terakhir berobat."}, {"id": 45, "category": "etika-hukum", "section": "teknis", "text": "Sasaran 5 Keselamatan Pasien", "options": {"A": "Hand hygiene 5 momen", "B": "Penggunaan APD lengkap", "C": "Sterilisasi alat", "D": "Isolasi pasien", "E": "Pemberian antibiotik profilaksis"}, "correctAnswer": "A", "explanation": "Sasaran 5 menekankan kepatuhan hand hygiene 5 momen sebagai langkah utama pencegahan infeksi nosokomial."}, {"id": 46, "category": "manajemen-puskesmas", "section": "teknis", "text": "Fungsi utama Puskesmas dalam Sistem Kesehatan Nasional adalah...", "options": {"A": "Pelayanan rawat inap spesialistik", "B": "Pusat pelayanan kesehatan tingkat pertama dan kesehatan masyarakat", "C": "Rujukan tertinggi kasus kompleks", "D": "Pendidikan tenaga kesehatan", "E": "Penelitian epidemiologi"}, "correctAnswer": "B", "explanation": "Puskesmas berfungsi sebagai pusat pelayanan kesehatan tingkat pertama (UKP) dan pusat pelayanan kesehatan masyarakat (UKM)."}, {"id": 47, "category": "manajemen-puskesmas", "section": "teknis", "text": "Standar Pelayanan Minimal (SPM) Puskesmas diatur berdasarkan...", "options": {"A": "Peraturan Menteri Kesehatan", "B": "Peraturan Presiden", "C": "Peraturan Pemerintah No. 2 Tahun 2018", "D": "Keputusan Menteri Kesehatan", "E": "Peraturan Daerah"}, "correctAnswer": "C", "explanation": "SPM bidang kesehatan diatur dalam PP No. 2 Tahun 2018 tentang Standar Pelayanan Minimal."}, {"id": 48, "category": "manajemen-puskesmas", "section": "teknis", "text": "Upaya Kesehatan Masyarakat (UKM) di Puskesmas dikelompokkan menjadi...", "options": {"A": "UKM esensial dan UKM rujukan", "B": "UKM dasar dan UKM lanjutan", "C": "UKM preventif dan UKM kuratif", "D": "UKM primer dan UKM sekunder", "E": "UKM langsung dan UKM tidak langsung"}, "correctAnswer": "A", "explanation": "UKM dibagi menjadi UKM esensial (dasar) dan UKM rujukan (klinik kesehatan masyarakat)."}, {"id": 49, "category": "manajemen-puskesmas", "section": "teknis", "text": "PIS-PK (Penilaian Independen Pencapaian Kinerja Puskesmas) dilaksanakan dengan frekuensi...", "options": {"A": "Setiap bulan", "B": "Setiap 3 bulan", "C": "Setiap 6 bulan", "D": "Setiap 1 tahun", "E": "Setiap 5 tahun"}, "correctAnswer": "D", "explanation": "PIS-PK (juga dikenal sebagai PKP — Penilaian Kinerja Puskesmas) dilakukan minimal 1 kali setahun."}, {"id": 50, "category": "manajemen-puskesmas", "section": "teknis", "text": "Sesuai Permenkes No. 25 Tahun 2014, jumlah Upaya Kesehatan Masyarakat Esensial di Puskesmas ada...", "options": {"A": "5 upaya", "B": "6 upaya", "C": "7 upaya", "D": "8 upaya", "E": "10 upaya"}, "correctAnswer": "B", "explanation": "Permenkes 25/2014 mengatur 6 UKM Esensial: UKM P2M, UKM Kesehatan Ibu, UKM Kesehatan Anak, UKM Gizi, UKM Kesehatan Lingkungan, UKM Promkes."}, {"id": 51, "category": "manajemen-puskesmas", "section": "teknis", "text": "Perencanaan obat di Puskesmas menggunakan metode...", "options": {"A": "Metode konvensional", "B": "Metode ABC/VEN (Consumption-morbiditas)", "C": "Metode trial and error", "D": "Metode order langsung", "E": "Metode stok maksimal"}, "correctAnswer": "B", "explanation": "Perencanaan obat Puskesmas menggunakan metode ABC/VEN dengan analisis konsumsi dan morbiditas untuk efisiensi."}, {"id": 52, "category": "manajemen-puskesmas", "section": "teknis", "text": "PLP (Penerimaan, Penyimpanan, Pendistribusian) obat di Puskesmas termasuk dalam fungsi...", "options": {"A": "Perencanaan", "B": "Pengadaan", "C": "Pengelolaan", "D": "Pemanfaatan", "E": "Pengawasan"}, "correctAnswer": "C", "explanation": "Penerimaan, penyimpanan, dan pendistribusian (PLP) termasuk fungsi pengelolaan obat di Puskesmas."}, {"id": 53, "category": "manajemen-puskesmas", "section": "teknis", "text": "Siklus manajemen Puskesmas yang ideal dimulai dari...", "options": {"A": "Pelaksanaan → Evaluasi → Perencanaan", "B": "Perencanaan → Pelaksanaan → Pengawasan → Evaluasi", "C": "Pengawasan → Perencanaan → Pelaksanaan", "D": "Evaluasi → Perencanaan → Pelaksanaan", "E": "Pelaksanaan → Perencanaan → Pengawasan"}, "correctAnswer": "B", "explanation": "Siklus manajemen Puskesmas: Perencanaan → Pelaksanaan → Pengawasan dan Pengendalian → Evaluasi."}, {"id": 54, "category": "manajemen-puskesmas", "section": "teknis", "text": "Cakupan D/S pada Puskesmas mengukur...", "options": {"A": "Cakupan kunjungan bayi dibagi balita", "B": "Cakupan kunjungan balita dibagi sasaran balita", "C": "Cakupan kunjungan ibu hamil", "D": "Cakupan imunisasi lengkap", "E": "Cakupan penimbangan balita"}, "correctAnswer": "B", "explanation": "D/S = jumlah balita yang ditimbang dibagi jumlah sasaran balita di wilayah kerja Puskesmas."}, {"id": 55, "category": "manajemen-puskesmas", "section": "teknis", "text": "Kegiatan UKM (Upaya Kesehatan Masyarakat) Perorangan di Puskesmas meliputi...", "options": {"A": "Promosi kesehatan", "B": "Pemeriksaan dan pengobatan pasien rawat jalan", "C": "Penyehatan lingkungan", "D": "Surveilans epidemiologi", "E": "Pemberantasan vektor"}, "correctAnswer": "B", "explanation": "UKP (Upaya Kesehatan Perorangan) di Puskesmas meliputi pemeriksaan, diagnosis, dan pengobatan pasien rawat jalan."}, {"id": 56, "category": "manajemen-puskesmas", "section": "teknis", "text": "Pengisian SPM (Standar Pelayanan Minimal) di Puskesmas dilaporkan ke...", "options": {"A": "Kementerian Kesehatan langsung", "B": "Dinas Kesehatan Kabupaten/Kota", "C": "Bupati/Walikota langsung", "D": "Kepala Daerah", "E": "BPS"}, "correctAnswer": "B", "explanation": "Puskesmas melaporkan SPM ke Dinas Kesehatan Kabupaten/Kota untuk diteruskan ke tingkat pusat."}, {"id": 57, "category": "manajemen-puskesmas", "section": "teknis", "text": "Pengorganisasian UKM rujukan di Puskesmas mencakup klinik untuk...", "options": {"A": "TB-MDR, kusta, DBD", "B": "Kesehatan jiwa, gigi, geriatric", "C": "P2 ISPA, diare, malaria", "D": "Rawat inap dan UGD", "E": "Spesialisasi penyakit dalam"}, "correctAnswer": "A", "explanation": "UKM rujukan mencakup klinik TB MDR, kusta, filariasis, DBD, dan lain-lain yang membutuhkan penanganan khusus."}, {"id": 58, "category": "manajemen-puskesmas", "section": "teknis", "text": "Perencanaan Operasional Puskesmas (POP) dibuat untuk periode...", "options": {"A": "1 tahun", "B": "2 tahun", "C": "5 tahun", "D": "10 tahun", "E": "Bulanan"}, "correctAnswer": "A", "explanation": "Perencanaan Operasional (POP) Puskesmas dibuat untuk periode 1 tahun (tahun berjalan) dengan kegiatan rinci."}, {"id": 59, "category": "manajemen-puskesmas", "section": "teknis", "text": "Indikator dari Rencana Usulan Kegiatan (RUK) Puskesmas terutama digunakan untuk...", "options": {"A": "Mengukur kinerja dokter", "B": "Menyusun rencana kegiatan tahun berikutnya", "C": "Mengukur kepuasan pasien", "D": "Mengukur kualitas pelayanan", "E": "Mengukur kinerja perawat"}, "correctAnswer": "B", "explanation": "RUK (Rencana Usulan Kegiatan) Puskesmas adalah dokumen perencanaan untuk menyusun kegiatan tahun berikutnya."}, {"id": 60, "category": "manajemen-puskesmas", "section": "teknis", "text": "Konsep", "options": {"A": "Alma-Ata 1978", "B": "Ottawa 1986", "C": "Jakarta 1997", "D": "Bangkok 2005", "E": "Helsinki 2013"}, "correctAnswer": "A", "explanation": "Deklarasi Alma-Ata 1978 menetapkan"}, {"id": 61, "category": "ppi-k3-kesling", "section": "teknis", "text": "Lima momen cuci tangan menurut WHO tidak termasuk...", "options": {"A": "Sebelum kontak dengan pasien", "B": "Sebelum tindakan aseptik", "C": "Sesudah terpapar cairan tubuh", "D": "Sesudah kontak dengan pasien", "E": "Sebelum makan"}, "correctAnswer": "E", "explanation": "Lima momen cuci tangan WHO: sebelum kontak pasien, sebelum tindakan aseptik, setelah risiko paparan cairan, setelah kontak pasien, setelah kontak lingkungan pasien — bukan sebelum makan."}, {"id": 62, "category": "ppi-k3-kesling", "section": "teknis", "text": "Penggunaan APD (Alat Pelindung Diri) yang benar saat menangani pasien COVID-19 suspek di ruang rawat adalah...", "options": {"A": "Masker bedah dan sarung tangan saja", "B": "Masker N95, faceshield, gaun panjang, sarung tangan, sepatu boot", "C": "Hanya masker N95", "D": "Masker bedah dan goggle", "E": "Tidak perlu APD bila jaga jarak 2m"}, "correctAnswer": "B", "explanation": "Penanganan pasien suspek COVID-19 dengan tindakan aerosolized memerlukan APD lengkap level 3: N95, faceshield, gaun, sarung tangan, sepatu boot."}, {"id": 63, "category": "ppi-k3-kesling", "section": "teknis", "text": "Warna kantong plastik untuk limbah infeksius menurut Permenkes adalah...", "options": {"A": "Kuning", "B": "Merah", "C": "Hijau", "D": "Hitam", "E": "Putih"}, "correctAnswer": "A", "explanation": "Limbah infeksius dikemas dalam kantong kuning dengan simbol biohazard."}, {"id": 64, "category": "ppi-k3-kesling", "section": "teknis", "text": "Limbah benda tajam (jarum suntik) harus dibuang ke...", "options": {"A": "Kantong kuning", "B": "Kantong hitam", "C": "Safety box kuning keras", "D": "Kantong merah", "E": "Tempat sampah biasa"}, "correctAnswer": "C", "explanation": "Limbah benda tajam harus dibuang ke safety box kuning keras yang tahan tusukan."}, {"id": 65, "category": "ppi-k3-kesling", "section": "teknis", "text": "Pemilihan APD berdasarkan risiko paparan mengikuti prinsip...", "options": {"A": "Universal precaution", "B": "Standard precaution", "C": "Droplet precaution", "D": "Contact precaution", "E": "Airborne precaution"}, "correctAnswer": "B", "explanation": "Standard precaution adalah prinsip dasar pemilihan APD untuk SEMUA pasien, diperketat sesuai tipe transmisi (kontak, droplet, airborne)."}, {"id": 66, "category": "ppi-k3-kesling", "section": "teknis", "text": "Standar kualitas air bersih untuk kebutuhan domestik sesuai Permenkes No. 32 Tahun 2017 adalah...", "options": {"A": "E.coli = 0 per 100 ml", "B": "E.coli < 10 per 100 ml", "C": "E.coli < 100 per 100 ml", "D": "E.coli < 1000 per 100 ml", "E": "Tidak ada batasan"}, "correctAnswer": "A", "explanation": "Sesuai Permenkes 32/2017, air bersih untuk minum harus 0 E.coli per 100 ml."}, {"id": 67, "category": "ppi-k3-kesling", "section": "teknis", "text": "SPMI (Standar Pelayanan Minimal Rumah Sakit) terkait PPI mensyaratkan angka infeksi nosokomial (ILO) ≤...", "options": {"A": "< 1%", "B": "< 5%", "C": "< 10%", "D": "< 15%", "E": "< 20%"}, "correctAnswer": "B", "explanation": "Target nasional ILO ≤ 5% sesuai standar PPI di fasilitas kesehatan."}, {"id": 68, "category": "ppi-k3-kesling", "section": "teknis", "text": "Sanitasi total berbasis masyarakat (STBM) memiliki 5 pilar, yang pertama adalah...", "options": {"A": "Stop BABS Bebas", "B": "Cuci tangan pakai sabun", "C": "Pengelolaan air minum aman", "D": "Pengelolaan sampah rumah tangga", "E": "Pengelolaan limbah cair"}, "correctAnswer": "A", "explanation": "Pilar pertama STBM adalah Stop BABS (Buang Air Besar Sembarangan) Bebas."}, {"id": 69, "category": "ppi-k3-kesling", "section": "teknis", "text": "Pada K3 (Keselamatan dan Kesehatan Kerja), APD untuk melindungi mata dari paparan cahaya pengelasan adalah...", "options": {"A": "Kacamata bening", "B": "Welding helmet/goggle filter shade", "C": "Faceshield bening", "D": "Sarung tangan", "E": "Respirator"}, "correctAnswer": "B", "explanation": "Pengelasan memerlukan helmet/goggle dengan filter shade sesuai tingkat radiasi UV/IR untuk melindungi retina."}, {"id": 70, "category": "ppi-k3-kesling", "section": "teknis", "text": "Insidental finding seorang pekerja terpapar darah akibat tertusuk jarum suntik bekas. Tindakan pertama yang benar adalah...", "options": {"A": "Laporkan ke K3 dan segera lakukan post-exposure prophylaxis (PEP) HIV", "B": "Diam saja bila tidak ada luka", "C": "Cuci dengan alkohol 70%", "D": "Berikan antibiotik profilaksis", "E": "Istirahat 1 hari"}, "correctAnswer": "A", "explanation": "Tertusuk jarum bekas: cuci dengan air sabun, laporkan, dan segera evaluasi PEP HIV dalam 2-72 jam pertama."}, {"id": 71, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Rute pemberian obat yang memiliki onset paling cepat adalah...", "options": {"A": "Sublingual", "B": "Intravena", "C": "Intramuskular", "D": "Subkutan", "E": "Oral"}, "correctAnswer": "B", "explanation": "Pemberian intravena (IV) memiliki onset paling cepat karena langsung masuk sirkulasi sistemik."}, {"id": 72, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Obat pilihan pertama untuk tachycardia ventricular dengan destabilisasi hemodinamik adalah...", "options": {"A": "Amiodaron IV", "B": "Adenosine IV", "C": "Verapamil IV", "D": "Lidokain IV", "E": "Atropine IV"}, "correctAnswer": "A", "explanation": "Amiodaron IV adalah obat pilihan VT dengan destabilisasi hemodinamik (jika tidak perlu synchroniz cardioversion segera)."}, {"id": 73, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Nilai normal gula darah puasa pada dewasa adalah...", "options": {"A": "< 70 mg/dL", "B": "70-100 mg/dL", "C": "100-126 mg/dL", "D": "126-200 mg/dL", "E": "> 200 mg/dL"}, "correctAnswer": "B", "explanation": "Gula darah puasa normal dewasa: 70-100 mg/dL (Perkeni). Diabetes jika GDP ≥ 126 mg/dL."}, {"id": 74, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "HbA1c mencerminkan kadar glukosa darah rata-rata dalam periode...", "options": {"A": "1 minggu", "B": "2-4 minggu", "C": "8-12 minggu", "D": "6 bulan", "E": "1 tahun"}, "correctAnswer": "C", "explanation": "HbA1c mencerminkan rata-rata glukosa darah 8-12 minggu (2-3 bulan) terakhir karena masa hidup eritrosit."}, {"id": 75, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Tanda WHO pada dehidrasi berat pada balita adalah...", "options": {"A": "Haus, mata cekung", "B": "Letargis, mata sangat cekung, cubitan kulit balik sangat lambat", "C": "Demam ringan", "D": "Mual dan muntah", "E": "Tidak buang air 6 jam"}, "correctAnswer": "B", "explanation": "Dehidrasi berat: letargis, mata sangat cekung, tidak bisa minum, cubitan kulit balik sangat lambat (> 2 detik)."}, {"id": 76, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Pada adult respiratory distress syndrome (ARDS), gambaran X-ray thorax khas berupa...", "options": {"A": "Infiltrat interstisial difus bilateral", "B": "Kavitas berdinding tipis", "C": "Pneumothorax", "D": "Efusi pleura", "E": "Massa bulat soliter"}, "correctAnswer": "A", "explanation": "ARDS menunjukkan infiltrat interstisial-alveolar difus bilateral (ground-glass opacity) tanpa gagal jantung kongestif."}, {"id": 77, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Bila pasien ditemukan henti jantung, urutan BLS (Basic Life Support) yang benar adalah...", "options": {"A": "Airway-Breathing-Compression", "B": "Compression-Airway-Breathing (C-A-B)", "C": "Breathing-Compression-Airway", "D": "Airway-Compression-Breathing", "E": "Compression-Breathing-Airway"}, "correctAnswer": "B", "explanation": "BLS 2020 menggunakan urutan C-A-B: Compression dulu (30x), lalu Airway, lalu Breathing (2x)."}, {"id": 78, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Dosis epinefrin standar pada cardiac arrest dewasa adalah...", "options": {"A": "0.1 mg IV bolus", "B": "1 mg IV bolus setiap 3-5 menit", "C": "5 mg IV bolus", "D": "10 mg IV bolus", "E": "0.5 mg subkutan"}, "correctAnswer": "B", "explanation": "Epinefrin 1 mg IV bolus setiap 3-5 menit selama resusitasi cardiac arrest dewasa (AHA 2020)."}, {"id": 79, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Indeks massa tubuh (IMT) untuk kategori obesitas pada orang Asia adalah...", "options": {"A": "> 23 kg/m²", "B": "> 25 kg/m²", "C": "> 27.5 kg/m²", "D": "> 30 kg/m²", "E": "> 35 kg/m²"}, "correctAnswer": "C", "explanation": "Klasifikasi Asia-Pasifik: obesitas IMT ≥ 27.5 kg/m²; overweight 23-24.9; normal 18.5-22.9."}, {"id": 80, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Kebutuhan cairan maintenance dewasa per hari menurut rumus Holliday-Segar (4-2-1) untuk 60 kg adalah...", "options": {"A": "1500 mL/24 jam", "B": "2000 mL/24 jam", "C": "2400 mL/24 jam", "D": "3000 mL/24 jam", "E": "3600 mL/24 jam"}, "correctAnswer": "C", "explanation": "Rumus 4-2-1: 10 kg pertama (40) + 10 kg kedua (20) + 40 kg sisanya @1 = 100 mL/jam → 2400 mL/24 jam."}, {"id": 81, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Jenis cairan kristaloid isotonik yang paling seimbang elektrolitnya adalah...", "options": {"A": "NaCl 0.9%", "B": "Ringer Laktat", "C": "Dextrose 5%", "D": "NaCl 3%", "E": "Aminofusin"}, "correctAnswer": "B", "explanation": "Ringer Laktat lebih seimbang elektrolitnya dibanding NaCl 0.9% (mendekati komposisi cairan ekstraseluler)."}, {"id": 82, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Interaksi obat yang paling berbahaya pada pasien yang minum warfarin adalah dengan...", "options": {"A": "Antasida", "B": "Eritromisin atau ketokonazol", "C": "Vitamin C", "D": "Parasetamol dosis rendah", "E": "Antihistamin"}, "correctAnswer": "B", "explanation": "Eritromisin/ketokonazol menghambat CYP3A4 sehingga meningkatkan kadar warfarin dan risiko perdarahan."}, {"id": 83, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Pemeriksaan penunjang yang paling spesifik untuk diagnosis infark miokard akut adalah...", "options": {"A": "CK-MB", "B": "Troponin I/T", "C": "LDH", "D": "AST (SGOT)", "E": "Myoglobin"}, "correctAnswer": "B", "explanation": "Troponin I/T adalah biomarker paling spesifik untuk infark miokard akut, naik dalam 3-4 jam dan bertahan 7-10 hari."}, {"id": 84, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Pada keadaan anafilaksis, obat pertama yang diberikan adalah...", "options": {"A": "Difenhidramin IV", "B": "Epinefrin 0.3-0.5 mg IM (anterolateral paha)", "C": "Hidrokortison IV", "D": "Salbutamol nebulizer", "E": "Oksigen 100%"}, "correctAnswer": "B", "explanation": "Epinefrin IM di paha anterolateral adalah pengobatan first-line anafilaksis (dewasa 0.3-0.5 mg)."}, {"id": 85, "category": "farmakologi-lab-gd-gizi", "section": "teknis", "text": "Pemberian makanan enteral pada pasien kritis dianjurkan dalam waktu...", "options": {"A": "< 6 jam sejak masuk ICU", "B": "24-48 jam sejak masuk ICU", "C": "Setelah 72 jam puasa", "D": "Setelah ekstubasi saja", "E": "Bila pasien sadar penuh"}, "correctAnswer": "B", "explanation": "Nutrition support therapy merekomendasikan nutrisi enteral dalam 24-48 jam pertama masuk ICU untuk pasien kritis."}, {"id": 86, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Akronim BerAKHLAK sebagai core values ASN berarti...", "options": {"A": "Berorientasi Pelayanan, Akuntabel, Kompeten, Harmonis, Loyal, Adaptif, Kolaboratif", "B": "Berintegritas, Akuntabel, Kompeten, Harmonis, Loyal, Adaptif, Kolaboratif", "C": "Berorientasi Hasil, Akuntabel, Kreatif, Harmonis, Loyal, Adaptif, Kolaboratif", "D": "Berintegritas, Aktual, Kompeten, Harmonis, Loyal, Adaptif, Kolaboratif", "E": "Berorientasi Pelayanan, Aktual, Kompeten, Hormat, Loyal, Adaptif, Kolaboratif"}, "correctAnswer": "A", "explanation": "BerAKHLAK = Berorientasi Pelayanan, Akuntabel, Kompeten, Harmonis, Loyal, Adaptif, Kolaboratif (ditetapkan via PermenPANRB)."}, {"id": 87, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Dalam ASN BerAKHLAK,", "options": {"A": "Bekerja sesuai standar pelayanan publik", "B": "Bertanggung jawab atas kepercayaan publik dan sumber daya negara", "C": "Mengutamakan kepentingan bersama di atas individu", "D": "Berdedikasi pada negara dan bangsa", "E": "Cepat menyesuaikan diri dengan perubahan"}, "correctAnswer": "B", "explanation": "Akuntabel = bertanggung jawab atas kepercayaan dan sumber daya yang diberikan publik kepada ASN."}, {"id": 88, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Pilar Smart ASN mencakup...", "options": {"A": "Smart PNS, smart PPPK, smart TNI", "B": "Smart Kinerja, smart talent, smart digital, smart service", "C": "Smart kompetensi, smart promosi, smart mutasi", "D": "Smart recruitment, smart training, smart remuneration", "E": "Smart leadership, smart culture, smart system"}, "correctAnswer": "B", "explanation": "Smart ASN: Smart Kinerja, Smart Talent, Smart Digital, Smart Service — pilar transformasi SDM ASN."}, {"id": 89, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Tahapan dalam proses manajemen perubahan menurut Kotter yang pertama adalah...", "options": {"A": "Membentuk visi dan strategi", "B": "Menciptakan urgensi", "C": "Mengkomunikasikan visi perubahan", "D": "Menghapus hambatan", "E": "Menciptakan kemenangan jangka pendek"}, "correctAnswer": "B", "explanation": "Model Kotter: 1) Menciptakan urgensi, 2) Membentuk koalisi pengarah, 3) Mengembangkan visi & strategi, ..."}, {"id": 90, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Gaya kepemimpinan situasional Hersey-Blanchard menekankan bahwa gaya kepemimpinan harus disesuaikan dengan...", "options": {"A": "Karakteristik organisasi", "B": "Tingkat kematangan (maturity) bawahan", "C": "Budaya perusahaan", "D": "Lingkungan eksternal", "E": "Jumlah karyawan"}, "correctAnswer": "B", "explanation": "Model Hersey-Blanchard: gaya kepemimpinan (Telling, Selling, Participating, Delegating) disesuaikan dengan tingkat kematangan bawahan."}, {"id": 91, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Empat fungsi manajemen klasik menurut Henri Fayol adalah...", "options": {"A": "Planning, Organizing, Actuating, Controlling (POAC)", "B": "Leading, Managing, Directing, Evaluating", "C": "Forecasting, Planning, Coordinating, Reporting", "D": "Planning, Doing, Checking, Acting", "E": "Setting goals, Hiring, Firing, Reporting"}, "correctAnswer": "A", "explanation": "Fungsi manajemen Fayol: Planning, Organizing, Actuating, Controlling (POAC)."}, {"id": 92, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Metode SWOT analysis dalam perencanaan strategis terdiri dari...", "options": {"A": "Strengths, Weaknesses, Opportunities, Threats", "B": "Strategy, Wisdom, Operation, Target", "C": "Standard, Working, Operation, Time", "D": "Strength, Wisdom, Output, Trust", "E": "Strategic, Wise, Open, Tactical"}, "correctAnswer": "A", "explanation": "SWOT = Strengths (kekuatan), Weaknesses (kelemahan) internal; Opportunities (peluang), Threats (ancaman) eksternal."}, {"id": 93, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Konsep", "options": {"A": "Specific, Measurable, Achievable, Relevant, Time-bound", "B": "Simple, Meaningful, Attainable, Realistic, Timely", "C": "Strategic, Manageable, Actionable, Reliable, Testable", "D": "Standard, Modern, Appropriate, Responsible, Trustworthy", "E": "Specific, Maintained, Achievable, Repeatable, Trackable"}, "correctAnswer": "A", "explanation": "SMART goals: Specific, Measurable, Achievable, Relevant, Time-bound — kerangka penyusunan tujuan yang baik."}, {"id": 94, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Dalam teori motivasi Maslow, hierarki kebutuhan dari terendah ke tertinggi adalah...", "options": {"A": "Fisiologis → Aman → Sosial → Penghargaan → Aktualisasi Diri", "B": "Aman → Fisiologis → Sosial → Penghargaan → Aktualisasi", "C": "Sosial → Aman → Fisiologis → Aktualisasi → Penghargaan", "D": "Penghargaan → Sosial → Aman → Fisiologis → Aktualisasi", "E": "Aktualisasi → Penghargaan → Sosial → Aman → Fisiologis"}, "correctAnswer": "A", "explanation": "Hierarki Maslow: fisiologis (basic) → keamanan → sosial → penghargaan → aktualisasi diri (puncak)."}, {"id": 95, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Komunikasi efektif dalam organisasi tidak ditandai oleh...", "options": {"A": "Keterbukaan dan transparansi", "B": "Mendengarkan aktif", "C": "Empati pada penerima pesan", "D": "Penggunaan jargon teknis yang rumit", "E": "Umpan balik yang konstruktif"}, "correctAnswer": "D", "explanation": "Penggunaan jargon teknis yang berlebihan justru menghambat komunikasi efektif, terutama kepada audiens non-teknis."}, {"id": 96, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Pemberian perilaku yang baik (leading by example) oleh pemimpin tercermin dari nilai...", "options": {"A": "Integritas", "B": "Loyal", "C": "Kompeten", "D": "Adaptif", "E": "Kolaboratif"}, "correctAnswer": "A", "explanation": "Leading by example paling erat dengan nilai Integritas — pemimpin menjalankan apa yang diucapkan."}, {"id": 97, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Sikap kolaboratif dalam tim multidisiplin kesehatan mengharuskan...", "options": {"A": "Mementingkan profesi sendiri", "B": "Saling berbagi informasi, menghargai kontribusi setiap profesi", "C": "Menghindari konflik dengan cara menyembunyikan pendapat", "D": "Mengikuti pendapat profesi paling senior", "E": "Membiarkan dokter memutuskan semua hal"}, "correctAnswer": "B", "explanation": "Kolaborasi tim multidisiplin: berbagi informasi, menghargai kontribusi tiap profesi untuk pasien."}, {"id": 98, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Pemecahan masalah dengan metode", "options": {"A": "Mencari 5 solusi alternatif", "B": "Menemukan akar penyebab masalah dengan bertanya \"mengapa\" 5 kali", "C": "Memecah masalah menjadi 5 bagian", "D": "Menggali 5 opini stakeholder", "E": "Membuat 5 kategori masalah"}, "correctAnswer": "B", "explanation": "Metode 5 Why (Toyota Production System) bertanya"}, {"id": 99, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Sikap Adaptif pada ASN BerAKHLAK terutama berhubungan dengan...", "options": {"A": "Pemenuhan target kuantitatif", "B": "Kemampuan menyesuaikan diri dengan perubahan zaman dan teknologi", "C": "Kepatuhan pada hierarki", "D": "Pengelolaan keuangan daerah", "E": "Penghargaan formal dari atasan"}, "correctAnswer": "B", "explanation": "Adaptif = cepat menyesuaikan diri dengan perubahan lingkungan, teknologi, dan tuntutan masyarakat."}, {"id": 100, "category": "manajerial-sosio-kultural", "section": "teknis", "text": "Bentuk konflik yang positif dalam organisasi yang dapat memicu inovasi disebut...", "options": {"A": "Konflik disfungsional", "B": "Konflik fungsional (konstruktif)", "C": "Konflik afektif", "D": "Konflik destruktif", "E": "Konflik laten"}, "correctAnswer": "B", "explanation": "Konflik fungsional/konstruktif memicu inovasi dan perbaikan; konflik disfungsional justru merusak."}, {"id": 101, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Tahapan dalam proses manajemen konflik yang pertama adalah...", "options": {"A": "Menghindari konflik", "B": "Mengidentifikasi dan memahami sumber konflik", "C": "Mediasi pihak ketiga", "D": "Apersepsi konflik", "E": "Komunikasi terbuka"}, "correctAnswer": "B", "explanation": "Manajemen konflik dimulai dengan mengidentifikasi dan memahami sumber/akar konflik sebelum intervensi."}, {"id": 102, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Sikap menghargai pendapat orang lain dalam diskusi tim mencerminkan nilai...", "options": {"A": "Loyalitas", "B": "Harmonis", "C": "Akuntabel", "D": "Kompeten", "E": "Adaptif"}, "correctAnswer": "B", "explanation": "Harmonis = saling menghargai perbedaan dan bekerja sama untuk kepentingan bersama."}, {"id": 103, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Dalam prinsip Public Service yang dianut ASN,orientasi pelayanan publik menekankan pada...", "options": {"A": "Kecepatan pelayanan tanpa memperhatikan kualitas", "B": "Pemenuhan kebutuhan masyarakat dengan kualitas dan integritas", "C": "Penyelesaian administrasi sebelum kebutuhan masyarakat", "D": "Volume pelayanan yang tinggi", "E": "Penghematan biaya pelayanan"}, "correctAnswer": "B", "explanation": "Berorientasi Pelayanan = memenuhi kebutuhan masyarakat dengan kualitas terbaik dan integritas."}, {"id": 104, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Prinsip tahapan pengambilan keputusan berdasarkan data dikenal dengan...", "options": {"A": "Top-down decision making", "B": "Data-driven decision making", "C": "Intuitive decision making", "D": "Random decision making", "E": "Consensus decision making"}, "correctAnswer": "B", "explanation": "Data-driven decision making: keputusan berbasis data dan analisis bukan asumsi atau intuisi semata."}, {"id": 105, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Teori motivasi yang membagi faktor motivasi menjadi", "options": {"A": "Abraham Maslow", "B": "Frederick Herzberg", "C": "David McClelland", "D": "Douglas McGregor", "E": "Clayton Alderfer"}, "correctAnswer": "B", "explanation": "Herzberg Two-Factor Theory: hygiene factors (gaji, lingkungan) mencegah ketidakpuasan; motivators (prestasi, pengakuan) memotivasi."}, {"id": 106, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Konsep", "options": {"A": "ASN sebagai warga negara biasa", "B": "Kepercayaan publik yang harus dijaga dengan integritas dan akuntabilitas", "C": "Hak ASN atas imbalan jasa", "D": "Hubungan ASN dengan atasan langsung", "E": "Kewajiban ASN membayar pajak"}, "correctAnswer": "B", "explanation": "Public Trust = kepercayaan masyarakat kepada ASN yang harus dijaga melalui integritas dan akuntabilitas."}, {"id": 107, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Sikap", "options": {"A": "Pelaporan pelanggaran etika dan hukum oleh ASN", "B": "Penolakan tugas dari atasan", "C": "Pengunduran diri ASN", "D": "Penonaktifan ASN", "E": "Protes atas kebijakan"}, "correctAnswer": "A", "explanation": "Whistleblowing: melaporkan pelanggaran etika/hukum yang merugikan negara — bagian dari Akuntabilitas."}, {"id": 108, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Sistem merit dalam pengelolaan ASN mengutamakan...", "options": {"A": "Senioritas dalam promosi", "B": "Kinerja dan kompetensi sebagai dasar promosi dan pengembangan karier", "C": "Koneksi politik", "D": "Asal daerah pegawai", "E": "Jenis kelamin"}, "correctAnswer": "B", "explanation": "Sistem merit: pengelolaan ASN berdasarkan kualifikasi, kinerja, dan kompetensi, bukan karena suka-relasi."}, {"id": 109, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Dalam prinsip Good Governance, transparansi berarti...", "options": {"A": "Membuka seluruh data rahasia negara", "B": "Memberikan akses informasi yang relevan kepada publik sesuai ketentuan", "C": "Mengumumkan gaji seluruh pegawai", "D": "Membuka rapat internal ke publik", "E": "Membocorkan dokumen internal"}, "correctAnswer": "B", "explanation": "Transparansi = memberi akses informasi yang relevan dan tidak rahasia kepada publik sesuai UU KIP."}, {"id": 110, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Prinsip delegasi wewenang yang efektif mensyaratkan...", "options": {"A": "Pendelegasian tanpa pengawasan", "B": "Pendelegasian disertai kejelasan tugas, wewenang, dan akuntabilitas", "C": "Pendelegasian hanya pada tugas yang sulit", "D": "Pendelegasian tugas tanpa batas waktu", "E": "Tidak boleh mendelegasikan sama sekali"}, "correctAnswer": "B", "explanation": "Delegasi efektif: tegas pada apa, kepada siapa, wewenang apa, batas waktu, dan mekanisme akuntabilitas."}, {"id": 111, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Konsep", "options": {"A": "Memperbanyak jumlah pegawai", "B": "Menghilangkan pemborosan (waste) dan meningkatkan value bagi pelanggan", "C": "Memotong gaji pegawai", "D": "Memperbanyak laporan administratif", "E": "Mengurangi jam kerja"}, "correctAnswer": "B", "explanation": "Lean Management: menghilangkan waste (overproduction, waiting, defects, dll) untuk memberi value maksimal."}, {"id": 112, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Sikap kolaboratif antar instansi pemerintah terutama diperlukan dalam...", "options": {"A": "Pengisian absensi harian", "B": "Penanganan bencana, kesehatan masyarakat, dan isu lintas-sektor", "C": "Pembuatan laporan bulanan", "D": "Penataan ruang kantor", "E": "Pemilihan panitia internal"}, "correctAnswer": "B", "explanation": "Isu lintas-sektor seperti bencana, KLB, stunting, dll. memerlukan kolaborasi multi-instansi (BNPB, Kemenkes, dll.)."}, {"id": 113, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Fungsi Control (pengawasan) dalam manajemen klasik dilakukan dengan cara...", "options": {"A": "Mengatur kembali struktur organisasi", "B": "Membandingkan realisasi dengan rencana dan melakukan koreksi", "C": "Mempekerjakan lebih banyak pegawai", "D": "Memberi pelatihan ulang", "E": "Mengganti pemimpin"}, "correctAnswer": "B", "explanation": "Controlling: membandingkan hasil dengan target/sasaran, menganalisis variansi, dan mengambil tindakan korektif."}, {"id": 114, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Pemberian pelatihan dan pengembangan kompetensi pegawai merupakan investasi pada...", "options": {"A": "Modal manusia (human capital)", "B": "Teknologi informasi", "C": "Fisik bangunan", "D": "Perlengkapan kantor", "E": "Sarana transportasi"}, "correctAnswer": "A", "explanation": "Pengembangan SDM = investasi pada human capital untuk meningkatkan kapabilitas jangka panjang."}, {"id": 115, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Sikap kerja yang mencerminkan nilai Loyalitas pada ASN BerAKHLAK adalah...", "options": {"A": "Mengikuti perintah walaupun salah", "B": "Berdedikasi pada negara, bangsa, dan pemerintahan yang sah", "C": "Membela atasan apapun yang terjadi", "D": "Tidak pernah mengkritik kebijakan", "E": "Mengikuti kebijakan partai"}, "correctAnswer": "B", "explanation": "Loyalitas ASN = berdedikasi pada NKRI, Pancasila, UUD 1945, dan pemerintahan sah — bukan loyalitas buta pada personel."}, {"id": 116, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Salah satu pilar Open Government Partnership (OGP) adalah...", "options": {"A": "Transparansi, partisipasi publik, akuntabilitas, inovasi teknologi", "B": "Penertiban birokrasi", "C": "Privasi data pejabat", "D": "Pengawasan internal", "E": "Pemberian bonus pegawai"}, "correctAnswer": "A", "explanation": "Pilar OGP: transparansi, partisipasi masyarakat, akuntabilitas, dan inovasi teknologi untuk tata kelola yang terbuka."}, {"id": 117, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Komitmen ASN pada etika publik tercermin dalam tindakan...", "options": {"A": "Menerima gratifikasi dalam bentuk apapun", "B": "Menolak gratifikasi dan melaporkannya ke KPK", "C": "Mengikuti kebiasaan setempat", "D": "Meminta imbalan informal untuk pelayanan", "E": "Memanfaatkan jabatan untuk kepentingan pribadi"}, "correctAnswer": "B", "explanation": "ASN wajib menolak gratifikasi dan melaporkannya ke KPK atau UU Tipikor berlaku."}, {"id": 118, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Dalam teori kepemimpinan transformasional, 4 komponen utamanya adalah...", "options": {"A": "Idealized influence, inspirational motivation, intellectual stimulation, individualized consideration", "B": "Command, control, comply, conform", "C": "Reward, punishment, supervision, evaluation", "D": "Order, dictate, manage, control", "E": "Coordinate, delegate, supervise, evaluate"}, "correctAnswer": "A", "explanation": "Kepemimpinan transformasional (Bass): 4I — Idealized Influence, Inspirational Motivation, Intellectual Stimulation, Individualized Consideration."}, {"id": 119, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Manajemen risiko di fasilitas kesehatan mencakup tahapan...", "options": {"A": "Identifikasi → Analisis → Evaluasi → Mitigasi → Monitoring", "B": "Perencanaan → Pelaksanaan → Evaluasi", "C": "Identifikasi → Pengobatan → Pemulihan", "D": "Survei → Pengawasan → Pelaporan", "E": "Audit → Investigasi → Tuntutan"}, "correctAnswer": "A", "explanation": "Siklus manajemen risiko: identifikasi → analisis → evaluasi → mitigasi → monitoring dan review."}, {"id": 120, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Dalam budaya organisasi yang sehat, dimensi yang menonjol meliputi...", "options": {"A": "Hierarki kaku, ikut-ikutan, takut salah", "B": "Inovasi, perhatian pada detail, orientasi hasil, kerja tim, integritas", "C": "Persaingan internal, ego sektoral", "D": "Patuh pada senior tanpa pertimbangan", "E": "Kesejahteraan individu di atas organisasi"}, "correctAnswer": "B", "explanation": "Budaya organisasi sehat: inovasi, perhatian detail, orientasi hasil, kerja tim, dan integritas (OCAI framework)."}, {"id": 121, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Konsep ZBB (Zero-Based Budgeting) dalam perencanaan anggaran pemerintah berarti...", "options": {"A": "Anggaran dimulai dari nol setiap tahun tanpa mengacu tahun sebelumnya", "B": "Anggaran ditambah 10% dari tahun lalu", "C": "Anggaran dipangkas 50%", "D": "Tidak ada anggaran untuk pos baru", "E": "Mengikuti inflasi tahunan"}, "correctAnswer": "A", "explanation": "Zero-Based Budgeting: setiap pos anggaran harus dipertanggungjawabkan dari nol, bukan increment dari tahun lalu."}, {"id": 122, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Tahapan dalam PDCA (Deming Cycle) untuk peningkatan mutu adalah...", "options": {"A": "Plan, Do, Check, Act", "B": "Predict, Direct, Compare, Achieve", "C": "Prepare, Deliver, Coordinate, Audit", "D": "Plan, Document, Coordinate, Approve", "E": "Project, Do, Calculate, Approve"}, "correctAnswer": "A", "explanation": "PDCA: Plan (perencanaan), Do (pelaksanaan), Check (verifikasi), Act (tindakan korektif) untuk continuous improvement."}, {"id": 123, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Konsep Kaizen dalam manajemen mutu berasal dari...", "options": {"A": "Cina", "B": "Jepang", "C": "Korea Selatan", "D": "Amerika Serikat", "E": "Jerman"}, "correctAnswer": "B", "explanation": "Kaizen (改善) adalah filosofi perbaikan berkelanjutan yang berasal dari Jepang, dipopulerkan Toyota Production System."}, {"id": 124, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Sikap profesional ASN yang berorientasi pelayanan tercermin dari...", "options": {"A": "Menunda pelayanan untuk istirahat", "B": "Memberikan pelayanan prima tanpa diskriminasi", "C": "Membatasi jam pelayanan", "D": "Menerima suap untuk mempercepat layanan", "E": "Memberikan prioritas pada relasi dekat"}, "correctAnswer": "B", "explanation": "Berorientasi Pelayanan: memberikan layanan prima tanpa diskriminasi kepada semua warga negara."}, {"id": 125, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Sistem akuntabilitas kinerja di instansi pemerintah mengacu pada...", "options": {"A": "LAKIP (Laporan Akuntabilitas Kinerja Instansi Pemerintah)", "B": "Laporan keuangan tahunan", "C": "Laporan kegiatan bulanan", "D": "Absensi pegawai", "E": "Notulen rapat"}, "correctAnswer": "A", "explanation": "LAKIP = laporan akuntabilitas kinerja instansi pemerintah, dasar evaluasi kinerja berbasis Inpres 7/1999."}, {"id": 126, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Untuk menilai kepuasan masyarakat atas pelayanan publik digunakan instrumen...", "options": {"A": "SKM (Survei Kepuasan Masyarakat)", "B": "Audit finansial BPK", "C": "Laporan bulanan", "D": "Evaluasi internal", "E": "Penilaian atasan"}, "correctAnswer": "A", "explanation": "SKM (Survei Kepuasan Masyarakat) diatur dalam Permenpan-RB untuk mengukur kepuasan atas pelayanan publik."}, {"id": 127, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Tanda dari", "options": {"A": "Memegang jabatan tinggi tanpa syarat pendidikan", "B": "Meningkatkan dan memelihara kompetensinya secara berkelanjutan", "C": "Mengandalkan pengalaman lama", "D": "Tidak mengikuti pelatihan", "E": "Mengandalkan rekomendasi atasan"}, "correctAnswer": "B", "explanation": "Kompeten = terus meningkatkan dan memelihara kompetensi melalui pelatihan dan pengembangan diri."}, {"id": 128, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Prinsip utama dalam penyelenggaraan Public Service Mall (MPP) adalah...", "options": {"A": "Pemusatan pelayanan publik dari berbagai instansi dalam satu tempat", "B": "Pemindahan ASN ke pusat kota", "C": "Penambahan birokrasi", "D": "Pembuatan gedung baru", "E": "Penghapusan pelayanan online"}, "correctAnswer": "A", "explanation": "MPP = Mal Pelayanan Publik: mengintegrasikan pelayanan berbagai instansi dalam satu lokasi untuk efisiensi."}, {"id": 129, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Dalam teori ADKAR untuk manajemen perubahan,", "options": {"A": "Resistance", "B": "Reinforcement", "C": "Reasoning", "D": "Restructuring", "E": "Reporting"}, "correctAnswer": "B", "explanation": "ADKAR (Prosci): Awareness, Desire, Knowledge, Ability, Reinforcement — model perubahan individual."}, {"id": 130, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Pendekatan", "options": {"A": "Kebutuhan dan kepuasan masyarakat sebagai pelanggan", "B": "Kepuasan pegawai", "C": "Volume dokumen yang dihasilkan", "D": "Kepuasan atasan", "E": "Jumlah anggaran terserap"}, "correctAnswer": "A", "explanation": "Customer-centric = masyarakat sebagai pelanggan utama; layanan dirancang berbasis kebutuhan mereka."}, {"id": 131, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Salah satu prinsip dalam Code of Conduct ASN Indonesia adalah...", "options": {"A": "Mementingkan kelompok/golongan sendiri", "B": "Menjunjung tinggi kejujuran, integritas, dan profesionalitas", "C": "Mengutamakan kedekatan dengan pejabat", "D": "Mengabaikan prosedur bila menguntungkan", "E": "Menolak inovasi"}, "correctAnswer": "B", "explanation": "Code of Conduct ASN menekankan kejujuran, integritas, dan profesionalitas dalam pelayanan publik."}, {"id": 132, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Sikap", "options": {"A": "Menolak teknologi baru", "B": "Memanfaatkan digital untuk pelayanan yang lebih cepat dan akurat", "C": "Mengandalkan kertas sepenuhnya", "D": "Membatasi jam online pelayanan", "E": "Membiarkan masyarakat antri"}, "correctAnswer": "B", "explanation": "Era digital: ASN harus memanfaatkan teknologi untuk mempercepat dan meningkatkan akurasi pelayanan publik."}, {"id": 133, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Tujuan utama reformasi birokrasi di Indonesia adalah...", "options": {"A": "Memperbanyak jumlah pegawai", "B": "Mewujudkan tata kelola pemerintahan yang bersih, efektif, dan responsif", "C": "Mengganti seluruh ASN", "D": "Memperbanyak aturan administratif", "E": "Mengurangi pelayanan publik"}, "correctAnswer": "B", "explanation": "Reformasi Birokrasi: bersih, efektif, transparan, akuntabel, dan responsif terhadap kebutuhan publik."}, {"id": 134, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Dalam situasi krisis/kedaruratan, ASN menunjukkan kompetensi kepemimpinan dengan...", "options": {"A": "Menunggu instruksi atasan", "B": "Mengambil keputusan cepat berbasis data untuk keselamatan publik", "C": "Menghindari tanggung jawab", "D": "Menyerahkan ke pihak swasta", "E": "Mengunci diri di kantor"}, "correctAnswer": "B", "explanation": "Dalam krisis, ASN dengan kompetensi kepemimpinan mengambil keputusan cepat berbasis data demi keselamatan publik."}, {"id": 135, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Sikap antisipatif terhadap perubahan kebijakan tercermin pada...", "options": {"A": "Menolak kebijakan baru", "B": "Mempelajari, beradaptasi, dan menyesuaikan diri dengan kebijakan baru", "C": "Menunda pelaksanaan selama mungkin", "D": "Mengabaikan instruksi atasan", "E": "Mengkritik tanpa solusi"}, "correctAnswer": "B", "explanation": "Adaptif: cepat mempelajari, memahami, dan menyesuaikan diri dengan kebijakan baru untuk pelayanan optimal."}, {"id": 136, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Salah satu pilar menuju Smart ASN adalah Smart Talent. Hal ini berkaitan dengan...", "options": {"A": "Pengembangan kapasitas pegawai berbasis kompetensi dan kinerja", "B": "Pengadaan perangkat IT", "C": "Pembangunan gedung baru", "D": "Penambahan remunerasi", "E": "Penambahan jumlah pegawai"}, "correctAnswer": "A", "explanation": "Smart Talent: sistem pengembangan SDM berbasis kompetensi, kinerja, dan jenjang karier yang objektif."}, {"id": 137, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Aspek", "options": {"A": "Hanya melayani kelompok mayoritas", "B": "Melayani semua kelompok termasuk penyandang disabilitas dan kelompok rentan", "C": "Mengutamakan pejabat", "D": "Mengutamakan warga lokal", "E": "Mengutamakan yang mampu membayar"}, "correctAnswer": "B", "explanation": "Inklusivitas: pelayanan harus dapat diakses semua kelompok termasuk disabilitas, lansia, ibu hamil, dan kelompok rentan."}, {"id": 138, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Dalam model kompetensi ASN,", "options": {"A": "Kemampuan komunikasi", "B": "Pengetahuan teknis sesuai bidang tugas (mis. klinis, farmakologi)", "C": "Kepemimpinan", "D": "Kerja tim", "E": "Integritas"}, "correctAnswer": "B", "explanation": "Technical competencies: keterampilan teknis spesifik bidang (mis. kompetensi klinis bagi tenaga kesehatan)."}, {"id": 139, "category": "manajerial-sosio-kultural", "section": "man-soskul", "text": "Komitmen terhadap etika publik ditunjukkan dengan tindakan berikut, KEC window.__CATEGORIES__ = [{"id": "asuhan-pelayanan", "label": "Asuhan & Pelayanan Kesehatan", "shortLabel": "Asuhan", "range": "1-30", "section": "teknis", "color": "emerald", "hex": "#10b981"}, {"id": "etika-hukum", "label": "Etika, Hukum Kesehatan & Patient Safety", "shortLabel": "Etika & Safety", "range": "31-45", "section": "teknis", "color": "rose", "hex": "#f43f5e"}, {"id": "manajemen-puskesmas", "label": "Manajemen Puskesmas & Kesehatan Masyarakat", "shortLabel": "Manajemen Puskesmas", "range": "46-60", "section": "teknis", "color": "amber", "hex": "#f59e0b"}, {"id": "ppi-k3-kesling", "label": "PPI, K3 & Kesehatan Lingkungan", "shortLabel": "PPI, K3 & Kesling", "range": "61-70", "section": "teknis", "color": "cyan", "hex": "#06b6d4"}, {"id": "farmakologi-lab-gd-gizi", "label": "Farmakologi, Lab, Gawat Darurat & Gizi", "shortLabel": "Farmakologi & GD", "range": "71-85", "section": "teknis", "color": "violet", "hex": "#8b5cf6"}, {"id": "manajerial-sosio-kultural", "label": "Manajerial & Sosio Kultural ASN BerAKHLAK", "shortLabel": "Manajerial & Sosio Kultural", "range": "86-150", "section": "man-soskul", "color": "slate", "hex": "#64748b"}];
</script>

<!-- ============ APP SCRIPT ============ -->
<script>

(function() {
  'use strict';

  let QUESTIONS = window.__QUESTIONS__;
  let CATEGORIES = window.__CATEGORIES__;
  /* [Supabase] helper escape atribut untuk nilai input identitas */
  const escAttr = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const EXAM_DURATION_SEC = 150 * 60;
  const PASSING_GRADE = 70;
  const STORAGE_KEY = 'manta-f-tryout-state-v1';

  // ============ STATE ============
  const state = {
    page: 'dashboard', // dashboard | intro | exam | results
    sidebarExpanded: { 'data-info': false },
    activeMenu: 'dashboard',
    exam: {
      currentIdx: 0,
      answers: {}, // { [questionId]: { answer: 'A'|null, isDoubt: bool } }
      startTime: null,
      endTime: null,
      started: false,
      finished: false,
      result: null,
      showEstimate: false,
      activeCategory: null,
    },
    filter: 'all',
    peserta: { nama: '', nip: '', unit_kerja: '' }, // [Supabase] identitas opsional (sukarela)
    timer: { remaining: EXAM_DURATION_SEC, intervalId: null },
  };

  // ============ PERSISTENCE ============
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved.exam) {
        state.exam = Object.assign(state.exam, saved.exam);
        // Don't restore timer's intervalId
        if (state.exam.started && !state.exam.finished && state.exam.startTime) {
          startTimer();
        }
      }
      if (saved.page) state.page = saved.page;
      if (saved.sidebarExpanded) state.sidebarExpanded = saved.sidebarExpanded;
      if (saved.activeMenu) state.activeMenu = saved.activeMenu;
      if (saved.peserta) state.peserta = Object.assign(state.peserta, saved.peserta);
    } catch (e) {
      console.warn('Failed to load state', e);
    }
  }

  function saveState() {
    try {
      const toSave = {
        page: state.page,
        sidebarExpanded: state.sidebarExpanded,
        activeMenu: state.activeMenu,
        peserta: state.peserta,
        exam: state.exam,
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    } catch (e) {
      console.warn('Failed to save state', e);
    }
  }

  // ============ HELPERS ============
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

  function formatTime(sec) {
    if (sec < 0) sec = 0;
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    return [h, m, s].map(x => String(x).padStart(2, '0')).join(':');
  }

  function getCategoryMeta(id) {
    return CATEGORIES.find(c => c.id === id) || { label: id, shortLabel: id, color: 'slate', hex: '#94a3b8' };
  }

  function currentQuestion() {
    return QUESTIONS[state.exam.currentIdx];
  }

  function calcStats() {
    let answered = 0, doubt = 0;
    for (const q of QUESTIONS) {
      const a = state.exam.answers[q.id];
      if (a && a.answer) answered++;
      if (a && a.isDoubt) doubt++;
    }
    return { answered, doubt, unanswered: QUESTIONS.length - answered, total: QUESTIONS.length };
  }

  function calcLiveEstimate() {
    let answered = 0, correct = 0, doubt = 0;
    const unansweredIds = [], doubtIds = [];
    const sectionStats = {
      teknis: { label: 'TEKNIS', total: 0, answered: 0, correct: 0 },
      'man-soskul': { label: 'MAN-SOSKUL', total: 0, answered: 0, correct: 0 },
    };
    for (const q of QUESTIONS) {
      sectionStats[q.section].total++;
      const rec = state.exam.answers[q.id];
      if (rec && rec.isDoubt) { doubt++; doubtIds.push(q.id); }
      if (rec && rec.answer) {
        answered++;
        sectionStats[q.section].answered++;
        if (rec.answer === q.correctAnswer) {
          correct++;
          sectionStats[q.section].correct++;
        }
      } else {
        unansweredIds.push(q.id);
      }
    }
    const total = QUESTIONS.length;
    const unanswered = total - answered;
    const estimatedNow = Math.round((correct / total) * 100);
    const maxPossible = Math.round(((correct + unanswered) / total) * 100);
    return {
      total, answered, unanswered, doubt, correct,
      estimatedScoreNow: estimatedNow,
      maxPossibleScore: maxPossible,
      perSection: Object.entries(sectionStats).map(([k, v]) => ({
        section: k, label: v.label, total: v.total, answered: v.answered, correct: v.correct,
        score: v.total > 0 ? Math.round((v.correct / v.total) * 100) : 0,
      })),
      unansweredIds, doubtIds,
      predictedPass: maxPossible >= PASSING_GRADE,
    };
  }

  function calcResult() {
    let answered = 0, correct = 0, wrong = 0, unanswered = 0;
    const catStats = {};
    const sectionStats = {
      teknis: { label: 'TEKNIS', total: 0, correct: 0 },
      'man-soskul': { label: 'MAN-SOSKUL', total: 0, correct: 0 },
    };
    for (const q of QUESTIONS) {
      sectionStats[q.section].total++;
      if (!catStats[q.category]) {
        catStats[q.category] = { label: getCategoryMeta(q.category).label, total: 0, correct: 0, wrong: 0, unanswered: 0 };
      }
      catStats[q.category].total++;
      const ans = state.exam.answers[q.id]?.answer || null;
      if (!ans) {
        unanswered++;
        catStats[q.category].unanswered++;
      } else {
        answered++;
        if (ans === q.correctAnswer) {
          correct++;
          catStats[q.category].correct++;
          sectionStats[q.section].correct++;
        } else {
          wrong++;
          catStats[q.category].wrong++;
        }
      }
    }
    const score = Math.round((correct / QUESTIONS.length) * 100);
    return {
      totalQuestions: QUESTIONS.length, answered, correct, wrong, unanswered,
      score, passed: score >= PASSING_GRADE,
      perCategory: Object.entries(catStats).map(([k, v]) => ({
        category: k, label: v.label, total: v.total, correct: v.correct, wrong: v.wrong, unanswered: v.unanswered,
        score: v.total > 0 ? Math.round((v.correct / v.total) * 100) : 0,
      })),
      perSection: Object.entries(sectionStats).map(([k, v]) => ({
        section: k, label: v.label, total: v.total, correct: v.correct,
        score: v.total > 0 ? Math.round((v.correct / v.total) * 100) : 0,
      })),
    };
  }

  // ============ TIMER ============
  function startTimer() {
    if (state.timer.intervalId) clearInterval(state.timer.intervalId);
    const tick = () => {
      if (!state.exam.startTime) return;
      const elapsed = Math.floor((Date.now() - state.exam.startTime) / 1000);
      const rem = EXAM_DURATION_SEC - elapsed;
      state.timer.remaining = rem;
      updateTimerUI(rem);
      if (rem <= 0) {
        clearInterval(state.timer.intervalId);
        state.timer.intervalId = null;
        finishExam();
      }
    };
    tick();
    state.timer.intervalId = setInterval(tick, 1000);
  }

  function stopTimer() {
    if (state.timer.intervalId) {
      clearInterval(state.timer.intervalId);
      state.timer.intervalId = null;
    }
  }

  function updateTimerUI(rem) {
    const el = $('#exam-timer');
    if (!el) return;
    el.textContent = formatTime(rem);
    const isWarn = rem <= 600 && rem > 120;
    const isCrit = rem <= 120 && rem > 0;
    const isExp = rem <= 0;
    el.classList.remove('pulse-warning', 'pulse-critical');
    if (isExp || isCrit) {
      el.classList.add('pulse-critical');
      el.style.color = '#b91c1c';
      el.style.backgroundColor = '#fee2e2';
      el.style.borderColor = '#fecaca';
    } else if (isWarn) {
      el.classList.add('pulse-warning');
      el.style.color = '#92400e';
      el.style.backgroundColor = '#fef3c7';
      el.style.borderColor = '#fde68a';
    } else {
      el.style.color = '#1e293b';
      el.style.backgroundColor = '#f1f5f9';
      el.style.borderColor = '#e2e8f0';
    }
  }

  // ============ RENDERING ============
  function render() {
    const app = $('#app');
    if (state.page === 'exam') {
      // Exam page is full-screen without sidebar
      app.innerHTML = renderExamPage();
      attachExamHandlers();
    } else {
      app.innerHTML = `
        <div class="flex min-h-screen bg-slate-50">
          ${renderSidebar()}
          <main class="flex-1 min-w-0">
            ${state.page === 'dashboard' ? renderDashboard() : ''}
            ${state.page === 'intro' ? renderIntro() : ''}
            ${state.page === 'results' ? renderResults() : ''}
          </main>
        </div>
      `;
      attachSidebarHandlers();
      if (state.page === 'dashboard') attachDashboardHandlers();
      if (state.page === 'intro') attachIntroHandlers();
      if (state.page === 'results') attachResultsHandlers();
    }
    saveState();
    window.scrollTo(0, 0);
  }

  // ============ SIDEBAR ============
  function renderSidebar() {

        render();

    $$('[data-nav]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        const nav = btn.getAttribute('data-nav');
        state.activeMenu = nav;
        if (nav === 'try-out') {
          // Reset exam if previously finished
          if (state.exam.finished) {
            resetExam();
          }
          state.page = 'intro';
        } else if (nav === 'dashboard') {
          state.page = 'dashboard';
        }
        render();
      });
    });
    $$('[data-menu]').forEach(btn => {

  function attachIntroHandlers() {
    const btn = $('#start-exam-btn');
    if (btn) btn.addEventListener('click', () => {
      startExam();
    });
    /* [Supabase] simpan identitas opsional saat diketik */
    const bind = (sel, key) => {
      const el = $(sel);
      if (el) el.addEventListener('input', () => {
        state.peserta[key] = el.value.slice(0, 120);
        saveState();
      });
    };
    bind('#id-nama', 'nama');
    bind('#id-nip', 'nip');
    bind('#id-unit', 'unit_kerja');
  }

  // ============ EXAM ============
  function startExam() {
    state.exam = {
      currentIdx: 0,
      answers: {},
      startTime: Date.now(),
      endTime: null,
      started: true,
      finished: false,
      result: null,
      showEstimate: false,
      activeCategory: null,
    };
    state.page = 'exam';
    startTimer();
    render();
  }

  function resetExam() {
    stopTimer();
    state.exam = {
      currentIdx: 0, answers: {}, startTime: null, endTime: null,
      started: false, finished: false, result: null,
      showEstimate: false, activeCategory: null,
    };
    state.timer = { remaining: EXAM_DURATION_SEC, intervalId: null };
    state.filter = 'all';
    saveState();
  }

  function finishExam() {
    stopTimer();
    state.exam.endTime = Date.now();
    state.exam.finished = true;
    state.exam.result = calcResult();
    state.page = 'results';
    render();
    /* [Supabase] kirim hasil ke tabel tryout_attempts (gagal = abaikan) */
    if (window.TryoutSync) {
      TryoutSync.submitAttempt(state.exam.result, {
        exam: state.exam,
        peserta: state.peserta,
        passingGrade: PASSING_GRADE,
        source: window.__serverQuestionsLoaded ? 'server' : 'lokal',
      });
    }
  }

  function renderAnswerGrid() {
    const teknis = QUESTIONS.filter(q => q.section === 'teknis');
    const manSos = QUESTIONS.filter(q => q.section === 'man-soskul');
    const currentId = currentQuestion().id;

    function cellClass(qId) {
      const a = state.exam.answers[qId];
      const isActive = qId === currentId;
      if (isActive) return 'grid-cell active';
      if (!a || a.answer === null) {
        if (a && a.isDoubt) return 'grid-cell doubt';
        return 'grid-cell unanswered';
      }
      if (a.isDoubt) return 'grid-cell answered-doubt';
      return 'grid-cell answered';
    }

    const teknisHtml = teknis.map(q => `
      <button data-jump="${q.id - 1}" class="cell-btn ${cellClass(q.id)} aspect-square rounded text-[11px] font-semibold border" title="Soal ${q.id}">${q.id}</button>
    `).join('');

    const manSosHtml = manSos.map(q => `
      <button data-jump="${q.id - 1}" class="cell-btn ${cellClass(q.id)} aspect-square rounded text-[11px] font-semibold border" title="Soal ${q.id}">${q.id}</button>
    `).join('');

    return `
      <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2">
          <h2 class="text-sm font-semibold text-slate-800">Lembar Jawaban</h2>

            Cek Estimasi
          </button>
        </div>
        <div class="px-4 py-3 border-b border-slate-100 grid grid-cols-2 gap-2 text-[10.5px] text-slate-600">
          <div class="flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-slate-100 border border-slate-300"></span>Belum dijawab</div>
          <div class="flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-emerald-500"></span>Sudah dijawab</div>
          <div class="flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-amber-200 border border-amber-400"></span>Ragu-ragu</div>
          <div class="flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-sky-500"></span>Soal aktif</div>
        </div>
        <div class="overflow-y-auto h-[420px] sm:h-[560px] p-4 space-y-4">
          <div>
            <div class="flex items-center gap-2 mb-2">
              <div class="h-2 w-2 rounded-full bg-emerald-500"></div>
              <h3 class="text-xs font-semibold text-slate-700 uppercase tracking-wide">TEKNIS (1-100)</h3>
            </div>
            <div class="grid grid-cols-10 gap-1.5">${teknisHtml}</div>
          </div>
          <div>
            <div class="flex items-center gap-2 mb-2">
              <div class="h-2 w-2 rounded-full bg-slate-500"></div>
              <h3 class="text-xs font-semibold text-slate-700 uppercase tracking-wide">MAN-SOSKUL (101-150)</h3>
            </div>
            <div class="grid grid-cols-10 gap-1.5">${manSosHtml}</div>
          </div>
        </div>
      </div>
    `;
  }

  function renderEstimatePanel() {
    const est = calcLiveEstimate();
    const isPass = est.estimatedScoreNow >= PASSING_GRADE;
    const canPass = est.maxPossibleScore >= PASSING_GRADE;
