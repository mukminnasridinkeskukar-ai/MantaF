  function attachExamHandlers() {
    // Click option
    $$('[data-opt]').forEach(btn => {
      btn.addEventListener('click', () => {
        const letter = btn.getAttribute('data-opt');
        const q = currentQuestion();
        if (!state.exam.answers[q.id]) state.exam.answers[q.id] = { answer: null, isDoubt: false };
        state.exam.answers[q.id].answer = letter;
        saveState();
        render();
      });
    });

    // Navigation
    const btnPrev = $('#btn-prev');
    if (btnPrev) btnPrev.addEventListener('click', () => {
      if (state.exam.currentIdx > 0) { state.exam.currentIdx--; saveState(); render(); }
    });
    const btnNext = $('#btn-next');
    if (btnNext) btnNext.addEventListener('click', () => {
      if (state.exam.currentIdx < QUESTIONS.length - 1) { state.exam.currentIdx++; saveState(); render(); }
    });
    const btnDoubt = $('#btn-doubt');
    if (btnDoubt) btnDoubt.addEventListener('click', () => {
      const q = currentQuestion();
      if (!state.exam.answers[q.id]) state.exam.answers[q.id] = { answer: null, isDoubt: false };
      state.exam.answers[q.id].isDoubt = !state.exam.answers[q.id].isDoubt;
      saveState();
      render();
    });
    const btnClear = $('#btn-clear');
    if (btnClear) btnClear.addEventListener('click', () => {
      const q = currentQuestion();
      state.exam.answers[q.id] = { answer: null, isDoubt: false };
      saveState();
      render();
    });

    // Estimate panel
    const btnEst = $('#btn-estimate');
    if (btnEst) btnEst.addEventListener('click', () => {
      state.exam.showEstimate = true;
      render();
    });
    const btnGridEst = $('#grid-estimate-btn');
    if (btnGridEst) btnGridEst.addEventListener('click', () => {
      state.exam.showEstimate = true;
      render();
    });

    // Finish dialog
    const btnFinish = $('#btn-finish');
    if (btnFinish) btnFinish.addEventListener('click', () => {
      state._showFinishDialog = true;
      render();
    });

    // Grid jump
    $$('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.getAttribute('data-jump'), 10);
        if (!isNaN(idx)) {
          state.exam.currentIdx = idx;
          if (state.exam.showEstimate && state._jumpClosesEstimate) {
            state.exam.showEstimate = false;
            state._jumpClosesEstimate = false;
          }
          saveState();
          render();
        }
      });
    });

    // Category tabs
    $$('[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.getAttribute('data-cat') || null;
        state.exam.activeCategory = cat;
        if (cat) {
          const firstIdx = QUESTIONS.findIndex(q => q.category === cat);
          if (firstIdx >= 0) state.exam.currentIdx = firstIdx;
        }
        saveState();
        render();
      });
    });

    // Estimate overlay
    const closeEst = $('#close-estimate');
    if (closeEst) closeEst.addEventListener('click', () => {
      state.exam.showEstimate = false;
      render();
    });
    const contBtn = $('#continue-btn');
    if (contBtn) contBtn.addEventListener('click', () => {
      state.exam.showEstimate = false;
      render();
    });
    // Also close estimate when clicking a jump button
    if (state.exam.showEstimate) {
      $$('[data-jump]').forEach(btn => {
        // Override to also close estimate
        const old = btn.onclick;
        btn.addEventListener('click', () => {
          state.exam.showEstimate = false;
        }, { once: true });
      });
    }

    // Finish dialog
    const cancelFinish = $('#cancel-finish');
    if (cancelFinish) cancelFinish.addEventListener('click', () => {
      state._showFinishDialog = false;
      render();
    });
    const confirmFinish = $('#confirm-finish');
    if (confirmFinish) confirmFinish.addEventListener('click', () => {
      state._showFinishDialog = false;
      finishExam();
    });

    // Keyboard shortcuts
    document.onkeydown = (e) => {
      if (state.exam.showEstimate || state._showFinishDialog) return;
      const target = e.target;
      if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) return;
      if (e.key === 'ArrowRight' && state.exam.currentIdx < QUESTIONS.length - 1) {
        state.exam.currentIdx++;
        saveState();
        render();
      } else if (e.key === 'ArrowLeft' && state.exam.currentIdx > 0) {
        state.exam.currentIdx--;
        saveState();
        render();
      } else if (['a','A','1'].includes(e.key)) {
        const q = currentQuestion();
        if (!state.exam.answers[q.id]) state.exam.answers[q.id] = { answer: null, isDoubt: false };
        state.exam.answers[q.id].answer = 'A';
        saveState(); render();
      } else if (['b','B','2'].includes(e.key)) {
        const q = currentQuestion();
        if (!state.exam.answers[q.id]) state.exam.answers[q.id] = { answer: null, isDoubt: false };
        state.exam.answers[q.id].answer = 'B';
        saveState(); render();
      } else if (['c','C','3'].includes(e.key)) {
        const q = currentQuestion();
        if (!state.exam.answers[q.id]) state.exam.answers[q.id] = { answer: null, isDoubt: false };
        state.exam.answers[q.id].answer = 'C';
        saveState(); render();
      } else if (['d','D','4'].includes(e.key)) {
        const q = currentQuestion();
        if (!state.exam.answers[q.id]) state.exam.answers[q.id] = { answer: null, isDoubt: false };
        state.exam.answers[q.id].answer = 'D';
        saveState(); render();
      } else if (['e','E','5'].includes(e.key)) {
        const q = currentQuestion();
        if (!state.exam.answers[q.id]) state.exam.answers[q.id] = { answer: null, isDoubt: false };
        state.exam.answers[q.id].answer = 'E';
        saveState(); render();
      }
    };

    // Scroll active cell into view
    const activeCell = $('[data-jump].grid-cell.active');
    if (activeCell) activeCell.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // ============ RESULTS ============
  function renderResults() {
    const r = state.exam.result;
    if (!r) return '<div class="p-6">No result.</div>';

    // Build review list with filter
    const reviewData = QUESTIONS.map(q => {
      const ans = state.exam.answers[q.id]?.answer || null;
      const isCorrect = ans === q.correctAnswer;
      const status = ans === null ? 'unanswered' : (isCorrect ? 'correct' : 'wrong');
      return { ...q, userAnswer: ans, isCorrect, status };
    });
    const filtered = reviewData.filter(item => {
      if (state.filter === 'all') return true;
      return item.status === state.filter;
    });

    const catColors = {};
    CATEGORIES.forEach(c => catColors[c.id] = c.hex);

    // SVG bar chart
    const maxScore = 100;
    const barWidth = 80;
    const barGap = 16;
    const chartWidth = CATEGORIES.length * (barWidth + barGap);
    const chartHeight = 220;
    const chartBars = CATEGORIES.map((cat, i) => {
      const stat = r.perCategory.find(c => c.category === cat.id);
      const score = stat ? stat.score : 0;
      const barHeight = (score / maxScore) * (chartHeight - 40);
      const x = i * (barWidth + barGap) + 10;
      const y = chartHeight - barHeight - 20;
      return `
        <rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" fill="${cat.hex}" rx="6">
          <animate attributeName="height" from="0" to="${barHeight}" dur=".5s" fill="freeze"/>
          <animate attributeName="y" from="${chartHeight - 20}" to="${y}" dur=".5s" fill="freeze"/>
        </rect>
        <text x="${x + barWidth/2}" y="${y - 5}" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">${score}</text>
        <text x="${x + barWidth/2}" y="${chartHeight - 5}" text-anchor="middle" font-size="10" fill="#475569">${cat.shortLabel}</text>
      `;
    }).join('');

    const reviewRows = filtered.map(q => {
      const cat = getCategoryMeta(q.category);
      const statusBadge = q.status === 'correct' ?
        '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] bg-emerald-100 text-emerald-800 border border-emerald-200">Benar</span>' :
        q.status === 'wrong' ?
        '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] bg-rose-100 text-rose-800 border border-rose-200">Salah</span>' :
        '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] bg-slate-100 text-slate-700 border border-slate-200">Kosong</span>';

      const statusBg = q.status === 'correct' ? 'bg-emerald-500 text-white' :
                       q.status === 'wrong' ? 'bg-rose-500 text-white' :
                       'bg-slate-300 text-slate-700';

      const optsList = ['A','B','C','D','E'].map(letter => {
        const isUser = q.userAnswer === letter;
        const isCorrect = q.correctAnswer === letter;
        const bg = isCorrect ? 'bg-emerald-50 border-emerald-200' :
                   (isUser && !isCorrect) ? 'bg-rose-50 border-rose-200' :
                   'border-transparent';
        const circle = isCorrect ? 'bg-emerald-500 text-white' :
                       (isUser && !isCorrect) ? 'bg-rose-500 text-white' :
                       'bg-slate-200 text-slate-700';
        const badge = isCorrect ? '<span class="ml-auto inline-flex items-center px-1.5 py-0.5 rounded text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200">Kunci</span>' :
                     (isUser && !isCorrect) ? '<span class="ml-auto inline-flex items-center px-1.5 py-0.5 rounded text-[10px] bg-rose-50 text-rose-700 border border-rose-200">Jawaban Anda</span>' : '';
        return `
          <div class="flex items-start gap-2 px-2 py-1.5 rounded text-xs border ${bg}">
            <span class="inline-flex items-center justify-center h-5 w-5 rounded-full text-[10px] font-semibold shrink-0 ${circle}">${letter}</span>
            <span class="text-slate-700 pt-0.5">${q.options[letter]}</span>
            ${badge}
          </div>
        `;
      }).join('');

      const userAnsText = q.userAnswer ?
        `<strong class="text-slate-800">${q.userAnswer}. ${q.options[q.userAnswer].slice(0,40)}${q.options[q.userAnswer].length>40?'...':''}</strong>` :
        '<strong class="text-slate-400 italic">(kosong)</strong>';
      const correctAnsText = `<strong class="text-emerald-700">${q.correctAnswer}. ${q.options[q.correctAnswer].slice(0,40)}${q.options[q.correctAnswer].length>40?'...':''}</strong>`;

      return `
        <div class="review-row rounded-md border border-slate-200 bg-white overflow-hidden">
          <button class="review-toggle w-full flex items-start gap-3 p-3 text-left hover:bg-slate-50 transition-colors">
            <span class="inline-flex items-center justify-center h-7 w-7 rounded-md text-xs font-semibold shrink-0 ${statusBg}">${q.id}</span>
            <div class="flex-1 min-w-0">
              <p class="text-sm text-slate-800 line-clamp-2">${q.text}</p>
              <div class="flex items-center gap-2 mt-1 text-xs text-slate-500 flex-wrap">
                <span>Jawaban Anda: ${userAnsText}</span>
                <span>·</span>
                <span>Kunci: ${correctAnsText}</span>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              ${statusBadge}
              <svg xmlns="http://www.w3.org/2000/svg" class="chevron h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </div>
          </button>
          <div class="options-list border-t border-slate-100 p-3 bg-slate-50/50">
            <div class="space-y-1.5 mb-2">${optsList}</div>
            <div class="mt-2 pt-2 border-t border-slate-200">
              <p class="text-xs text-slate-600"><strong class="text-slate-700">Pembahasan:</strong> ${q.explanation}</p>
            </div>
          </div>
        </div>
      `;
    }).join('');

    const filterBtns = [
      { id: 'all', label: `Semua (${QUESTIONS.length})` },
      { id: 'correct', label: `Benar (${r.correct})` },
      { id: 'wrong', label: `Salah (${r.wrong})` },
      { id: 'unanswered', label: `Kosong (${r.unanswered})` },
    ].map(opt => `
      <button data-filter="${opt.id}" class="px-2 py-1 rounded-md transition-colors text-xs ${state.filter===opt.id?'bg-slate-900 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${opt.label}</button>
    `).join('');

    return `
      <div class="min-h-screen bg-slate-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
          <div class="rounded-lg border-2 shadow-md overflow-hidden mb-6 ${r.passed?'border-emerald-300':'border-rose-300'}">
            <div class="px-6 py-8 text-center text-white ${r.passed?'bg-emerald-600':'bg-rose-600'}">
              <div class="inline-flex items-center justify-center h-16 w-16 rounded-full bg-white/20 mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 19.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 19.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
              </div>
              <h1 class="text-2xl sm:text-3xl font-bold mb-2">${r.passed?'SELAMAT, ANDA LULUS!':'BELUM LULUS'}</h1>
              <p class="text-white/90 text-sm mb-4">${r.passed?'Anda memenuhi passing grade uji kompetensi (≥ 70).':'Anda belum mencapai passing grade (≥ 70). Tetap semangat belajar!'}</p>
              <div class="inline-flex items-baseline gap-2">
                <span class="text-6xl font-bold tabular-nums">${r.score}</span>
                <span class="text-2xl font-medium text-white/80">/ 100</span>
              </div>
              <div class="mt-3 text-sm text-white/90">${r.correct} benar · ${r.wrong} salah · ${r.unanswered} kosong</div>
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="rounded-lg border p-4 bg-emerald-50 border-emerald-200 text-emerald-700">
              <div class="flex items-center gap-1.5 text-[11px] font-medium uppercase mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Benar
              </div>
              <div class="text-2xl font-bold">${r.correct}</div>
            </div>
            <div class="rounded-lg border p-4 bg-rose-50 border-rose-200 text-rose-700">
              <div class="flex items-center gap-1.5 text-[11px] font-medium uppercase mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>Salah
              </div>
              <div class="text-2xl font-bold">${r.wrong}</div>
            </div>
            <div class="rounded-lg border p-4 bg-slate-50 border-slate-200 text-slate-700">
              <div class="flex items-center gap-1.5 text-[11px] font-medium uppercase mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>Tidak Dijawab
              </div>
              <div class="text-2xl font-bold">${r.unanswered}</div>
            </div>
            <div class="rounded-lg border p-4 ${r.passed?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-rose-50 border-rose-200 text-rose-700'}">
              <div class="flex items-center gap-1.5 text-[11px] font-medium uppercase mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 19.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 19.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Skor Akhir
              </div>
              <div class="text-2xl font-bold">${r.score}</div>
            </div>
          </div>

          <div class="rounded-lg border border-slate-200 shadow-sm bg-white mb-6">
            <div class="px-6 py-4 border-b border-slate-100">
              <h3 class="text-base font-semibold">Skor per Bagian</h3>
            </div>
            <div class="p-6">
              <div class="space-y-4">
                ${r.perSection.map(s => `
                  <div>
                    <div class="flex items-center justify-between mb-1.5">
                      <div class="flex items-center gap-2">
                        <span class="h-2.5 w-2.5 rounded-full ${s.section==='teknis'?'bg-emerald-500':'bg-slate-500'}"></span>
                        <span class="text-sm font-medium text-slate-800">${s.label}</span>
                        <span class="text-xs text-slate-500">(${s.correct}/${s.total} benar)</span>
                      </div>
                      <span class="text-sm font-bold text-slate-800">${s.score}</span>
                    </div>
                    <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
                      <div class="h-full ${s.section==='teknis'?'bg-emerald-500':'bg-slate-500'} transition-all" style="width:${s.score}%"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="rounded-lg border border-slate-200 shadow-sm bg-white mb-6">
            <div class="px-6 py-4 border-b border-slate-100">
              <h3 class="text-base font-semibold">Breakdown Nilai per Kategori</h3>
            </div>
            <div class="p-6">
              <div class="w-full overflow-x-auto">
                <svg viewBox="0 0 ${chartWidth + 20} ${chartHeight + 10}" class="w-full" style="max-height:280px">
                  <line x1="0" y1="${chartHeight - 20}" x2="${chartWidth + 20}" y2="${chartHeight - 20}" stroke="#e2e8f0" stroke-width="1"/>
                  <line x1="10" y1="0" x2="10" y2="${chartHeight - 20}" stroke="#e2e8f0" stroke-width="1"/>
                  ${[0, 25, 50, 75, 100].map(t => {
                    const y = chartHeight - 20 - (t/100) * (chartHeight - 40);
                    return `<line x1="10" y1="${y}" x2="${chartWidth + 20}" y2="${y}" stroke="#f1f5f9" stroke-width="1"/><text x="0" y="${y+3}" font-size="9" fill="#94a3b8" text-anchor="end">${t}</text>`;
                  }).join('')}
                  ${chartBars}
                </svg>
              </div>
              <div class="space-y-2 mt-4">
                ${r.perCategory.map(c => {
                  const cat = getCategoryMeta(c.category);
                  return `
                    <div class="flex items-center justify-between gap-3 p-2.5 rounded-md border border-slate-200 bg-white">
                      <div class="flex items-center gap-2 min-w-0">
                        <span class="h-2.5 w-2.5 rounded-full shrink-0" style="background:${cat.hex}"></span>
                        <span class="text-xs sm:text-sm font-medium text-slate-700 truncate">${c.label}</span>
                      </div>
                      <div class="flex items-center gap-3 shrink-0 text-xs">
                        <span class="text-emerald-700 font-medium">${c.correct} ✓</span>
                        <span class="text-rose-700 font-medium">${c.wrong} ✗</span>
                        <span class="text-slate-500">${c.unanswered} −</span>
                        <span class="font-bold text-slate-800 w-10 text-right">${c.score}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <div class="rounded-lg border border-slate-200 shadow-sm bg-white mb-6">
            <div class="px-6 py-3 border-b border-slate-100 flex items-center justify-between gap-2 flex-wrap">
              <h3 class="text-base font-semibold">Review Lengkap · Jawaban vs Kunci</h3>
              <div class="flex items-center gap-1 text-xs flex-wrap">${filterBtns}</div>
            </div>
            <div class="p-6 space-y-2">${reviewRows}${filtered.length===0?'<p class="text-center text-sm text-slate-500 py-8">Tidak ada soal pada filter ini.</p>':''}</div>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button id="back-home" class="btn btn-secondary px-4 py-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Kembali ke Dashboard
            </button>
            <button id="restart" class="btn btn-primary px-4 py-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              Ulangi Ujian
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function attachResultsHandlers() {
    $$('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.filter = btn.getAttribute('data-filter');
        render();
      });
    });
    $$('.review-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.review-row');
        row.classList.toggle('open');
      });
    });
    const backHome = $('#back-home');
    if (backHome) backHome.addEventListener('click', () => {
      state.page = 'dashboard';
      state.activeMenu = 'dashboard';
      render();
    });
    const restart = $('#restart');
    if (restart) restart.addEventListener('click', () => {
      resetExam();
      state.page = 'intro';
      render();
    });
  }

  // ============ INIT ============
  loadState();
  // Auto-route to results if exam was finished
  if (state.exam.finished && state.exam.result && state.page !== 'results') {
    state.page = 'results';
  }
  render();

  // Expose state for debugging
  window.__state = state;
  /* [Supabase] ganti bank soal dari database (dipanggil TryoutSync).
     Ditolak bila ujian sedang berjalan agar jawaban tidak kacau. */
  window.__applyServerQuestions = function (qs, cs) {
    if (!Array.isArray(qs) || !qs.length || !Array.isArray(cs) || !cs.length) return false;
    if (state.exam.started && !state.exam.finished) return false;
    QUESTIONS = qs;
    CATEGORIES = cs;
    window.__QUESTIONS__ = qs;
    window.__CATEGORIES__ = cs;
    window.__serverQuestionsLoaded = true;
    if (state.page === 'dashboard' || state.page === 'intro') render();
    return true;
  };
})();

</script>

<!-- ============ [SUPABASE] SINKRONISASI TRY OUT ============ -->
<script>
(function () {
  'use strict';
  const TAG = '[TryoutSync]';
  let tdb = null;

  try {
    if (typeof supabase === 'undefined') throw new Error('Supabase JS tidak termuat (CDN diblokir?)');
    if (typeof SUPABASE_CONFIG === 'undefined') throw new Error('assets/js/config.js tidak termuat');
    if (SUPABASE_CONFIG.url.includes('SUPABASE-PROJECT-URL') || SUPABASE_CONFIG.anonKey.includes('SUPABASE_ANON')) {
      throw new Error('konfigurasi Supabase belum diisi');
    }
    tdb = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
  } catch (e) {
    console.warn(TAG, 'nonaktif —', e.message);
  }

  /* badge status kecil di kanan-bawah (di atas tombol Kembali ke MantaF) */
  function badge(text, kind) {
    let el = document.getElementById('tryoutSyncBadge');
    if (!el) {
      el = document.createElement('div');
      el.id = 'tryoutSyncBadge';
      el.className = 'fixed bottom-16 right-4 z-50 px-3 py-1.5 rounded-full text-xs font-medium shadow-lg';
      el.style.transition = 'opacity .4s';
      document.body.appendChild(el);
    }
    el.style.backgroundColor = kind === 'ok' ? '#059669' : (kind === 'warn' ? '#d97706' : '#64748b');
    el.style.color = '#fff';
    el.textContent = text;
    el.style.opacity = '1';
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.style.opacity = '0'; }, 6000);
  }

  const TryoutSync = {
    status: tdb ? 'ready' : 'off',

    /* Muat bank soal dari Supabase; return null bila gagal/kosong
       (halaman otomatis fallback ke soal bawaan HTML) */
    async loadQuestions() {
      if (!tdb) return null;
      try {
        const [catQ, soalQ] = await Promise.all([
          tdb.from('tryout_categories').select('*').eq('aktif', true).order('urutan'),
          tdb.from('tryout_questions').select('*').eq('aktif', true).order('id', { ascending: true }),
        ]);
        if (catQ.error) throw catQ.error;
        if (soalQ.error) throw soalQ.error;
        if (!catQ.data || !catQ.data.length) throw new Error('tabel tryout_categories kosong');
        if (!soalQ.data || !soalQ.data.length) throw new Error('tabel tryout_questions kosong (jalankan supabase/tryout-schema.sql)');

        const cs = catQ.data.map(function (r) {
          return { id: r.id, label: r.label, shortLabel: r.short_label, range: r.range_label, section: r.section, color: r.color, hex: r.hex };
        });
        const qs = soalQ.data.map(function (r) {
          return { id: r.id, category: r.kategori_id, section: r.section, text: r.pertanyaan, options: r.opsi, correctAnswer: r.jawaban, explanation: r.pembahasan || '' };
        });
        return { qs: qs, cs: cs };
      } catch (e) {
        const msg = e && e.message ? e.message : String(e);
        console.warn(TAG, 'muat soal dari server gagal — pakai soal bawaan HTML:', msg);
        return null;
      }
    },

    /* Kirim hasil pengerjaan ke tabel tryout_attempts (fire-and-forget) */
    async submitAttempt(result, ctx) {
      if (!tdb || !result || !ctx || !ctx.exam) return;
      const exam = ctx.exam;
      const durasi = (exam.startTime && exam.endTime) ? Math.max(0, Math.round((exam.endTime - exam.startTime) / 1000)) : 0;
      const row = {
        nama: ((ctx.peserta && ctx.peserta.nama) || '').trim(),
        nip: ((ctx.peserta && ctx.peserta.nip) || '').trim(),
        unit_kerja: ((ctx.peserta && ctx.peserta.unit_kerja) || '').trim(),
        jumlah_soal: result.totalQuestions || 0,
        jumlah_dijawab: result.answered || 0,
        jumlah_benar: result.correct || 0,
        jumlah_salah: result.wrong || 0,
        tidak_dijawab: result.unanswered || 0,
        nilai: result.score || 0,
        lulus: !!result.passed,
        passing_grade: ctx.passingGrade || 70,
        durasi_detik: durasi,
        sumber_soal: ctx.source === 'server' ? 'server' : 'lokal',
        rincian_kategori: result.perCategory || [],
        jawaban: exam.answers || {},
        user_agent: (navigator.userAgent || '').slice(0, 300),
      };
      try {
        const { error } = await tdb.from('tryout_attempts').insert(row);
        if (error) throw error;
        console.info(TAG, 'hasil tersimpan ke Supabase (nilai ' + row.nilai + ')');
        badge('Hasil tersimpan ke server', 'ok');
      } catch (e) {
        const msg = e && e.message ? e.message : String(e);
        console.warn(TAG, 'gagal simpan hasil:', msg);
        badge('Hasil gagal ke server — tersimpan di perangkat ini', 'warn');
      }
    },
  };

  window.TryoutSync = TryoutSync;

  /* Ganti bank soal bawaan dengan data dari database (bila tersedia & aman) */
  (async function () {
    const data = await TryoutSync.loadQuestions();
    if (!data) return;
    if (window.__applyServerQuestions && window.__applyServerQuestions(data.qs, data.cs)) {
      TryoutSync.status = 'db';
      console.info(TAG, 'bank soal dimuat dari Supabase: ' + data.qs.length + ' soal, ' + data.cs.length + ' kategori');
    }
  })();
})();
</script>
